name: Sync category and tag data files

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-category-tag-data:
    name: Sync data files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get changed post files
        id: changed
        run: |
          git fetch origin ${{ github.base_ref }} --quiet

          # Added (A) or Modified (M) .md files inside _posts/
          CHANGED=$(git diff --name-only --diff-filter=AM \
            origin/${{ github.base_ref }}...HEAD \
            -- '_posts/*.md' | tr '\n' ' ')

          echo "files=${CHANGED}" >> "$GITHUB_OUTPUT"

          if [ -z "$CHANGED" ]; then
            echo "No post files changed — skipping sync."
          else
            echo "Changed posts: $CHANGED"
          fi

      - name: Set up Python
        if: steps.changed.outputs.files != ''
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Register missing categories and tags
        if: steps.changed.outputs.files != ''
        id: create
        run: |
          python3 .github/scripts/create_missing_pages.py ${{ steps.changed.outputs.files }}

      - name: Commit data file changes
        if: steps.create.outputs.created_count != '' && steps.create.outputs.created_count != '0'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add _data/categories.yml _data/tags.yml
          git commit -m "chore: register new categories/tags"
          git push origin "HEAD:$HEAD_REF"

      - name: Comment on PR
        if: steps.create.outputs.created_count != '' && steps.create.outputs.created_count != '0'
        uses: actions/github-script@v9
        env:
          PR_COMMENT: ${{ steps.create.outputs.pr_comment }}
        with:
          script: |
            const body = process.env.PR_COMMENT;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              body,
            });

      - name: No new categories or tags needed
        if: steps.changed.outputs.files == '' || steps.create.outputs.created_count == '0'
        run: echo "All categories, subcategories, and tags already registered."
