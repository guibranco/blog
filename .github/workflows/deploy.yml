name: Deploy Jekyll to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # git_last_modified.rb needs full history to walk each file's past
          # revisions and find the last one that actually changed its body —
          # a shallow clone leaves only the latest commit, so every post
          # would resolve to "updated today".
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      # Gallery photos → AVIF/WebP derivatives + _data/images.json (ADR-0011).
      # Build output, never committed: the derivatives folder is cached across
      # runs keyed on the source photos, so a routine deploy re-encodes nothing.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install image tooling
        run: python3 -m pip install --quiet "Pillow>=11.2"

      - name: Restore image derivatives cache
        uses: actions/cache@v4
        with:
          path: assets/img/derived
          key: img-derived-${{ hashFiles('assets/img/posts/**', '.github/scripts/build_images.py') }}
          restore-keys: |
            img-derived-

      - name: Build responsive image derivatives
        run: python3 .github/scripts/build_images.py

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
