# Country registry for the travels page.
# `name` is the pt-BR display name and MUST match the value used in a post's
# `countries:` front matter (the blog audit checks this). `name_en` is the
# English label shown when the UI language is EN; `slug` ties the two together
# for the client-side language switch.
- name: Albânia
  slug: albania
  name_en: Albania
- name: Emirados Árabes Unidos
  slug: emirados-arabes-unidos
  name_en: United Arab Emirates
- name: Grécia
  slug: grecia
  name_en: Greece
- name: Irlanda
  slug: irlanda
  name_en: Ireland
- name: Malta
  slug: malta
  name_en: Malta
- name: Portugal
  slug: portugal
  name_en: Portugal
- name: Reino Unido
  slug: reino-unido
  name_en: United Kingdom
