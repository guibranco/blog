# UI copy and reference amounts for _includes/calculators/fx-converter.html
# (ADR-0015, ADR-0018). Unlike the other Calculators this one carries no rate:
# the rate, the currency pair and the date it applied come from the Post's
# front matter —
#
#   fx:
#     from: AED        # the trip's local currency (ISO 4217)
#     to: EUR          # the currency the Post converts into
#     rate: 3.97       # how many `from` one `to` bought: 1 EUR = 3.97 AED
#     as_of: 2022-04   # when that rate applied (year-month, or a full date)
#
# — because each travel Post documents the rate of its own trip, never a
# current one. `updated` stamps this file's copy, not any rate.

updated: 2026-09-19

# Amounts in the `from` currency shown in the static (no-JavaScript) table.
reference_amounts: [10, 50, 100, 500, 1000]

