# Rates for _includes/calculators/clt-vs-pj-br.html (ADR-0015): the PJ side of
# the CLT × PJ comparison — Simples Nacional annexes, the Fator R rule and the
# partner's INSS on the pró-labore — plus the employer-cost premises used for
# the CLT side. The CLT payslip tables (INSS, IRRF, FGTS, 13º, férias) are
# shared with the Ireland × Brazil calculator and live in shared/brazil-clt.yml
# (ADR-0017); a new tax year is a data edit in these two files, never a logic
# edit.
#
# Money is in BRL; rates are fractions (0.06 = 6%). Simples bands are listed
# bottom-up with `up_to` as the top of the band (gross revenue in 12 months).

tax_year: 2026
updated: 2026-09-18

pj:
  simples:
    # LC 123/2006, art. 18 §5º-J: when payroll (pró-labore included) is at or
    # above this share of revenue, the Anexo V activities are taxed by Anexo III.
    fator_r_threshold: 0.28
    # Effective rate = (RBT12 × rate − deduct) ÷ RBT12, RBT12 being the
    # revenue of the last twelve months. Above the last band the company
    # leaves the Simples; Lucro Presumido is not modelled.
    annexes:
      iii:
        label: "Anexo III"
        bands:
          - { up_to: 180000,  rate: 0.06,  deduct: 0 }
          - { up_to: 360000,  rate: 0.112, deduct: 9360 }
          - { up_to: 720000,  rate: 0.135, deduct: 17640 }
          - { up_to: 1800000, rate: 0.16,  deduct: 35640 }
          - { up_to: 3600000, rate: 0.21,  deduct: 125640 }
          - { up_to: 4800000, rate: 0.33,  deduct: 648000 }
      v:
        label: "Anexo V"
        bands:
          - { up_to: 180000,  rate: 0.155, deduct: 0 }
          - { up_to: 360000,  rate: 0.18,  deduct: 4500 }
          - { up_to: 720000,  rate: 0.195, deduct: 9900 }
          - { up_to: 1800000, rate: 0.205, deduct: 17100 }
          - { up_to: 3600000, rate: 0.23,  deduct: 62100 }
          - { up_to: 4800000, rate: 0.305, deduct: 540000 }
  prolabore:
    # Partner's INSS (contribuinte individual) withheld from the pró-labore,
    # capped at the INSS ceiling from the shared file; the company's 20% is
    # inside the DAS for Anexos III and V. The pró-labore is never below the
    # minimum wage.
    inss_rate: 0.11

employer:
  # What a CLT salary costs a company outside the Simples on top of the gross:
  # INSS patronal 20% + RAT 1% + terceiros 5.8%. FGTS (8%) comes from the
  # shared file. Both apply to the salary plus the monthly provisions for the
  # 13º and for the holiday month with its third.
  charges_rate: 0.268
  # Provision for the 40% fine on the FGTS balance, due on dismissal.
  fgts_fine_rate: 0.40

# Official tables each figure was checked against, with the check date. The
# CLT payslip sources are listed in shared/brazil-clt.yml.
sources:
  - label: "Planalto — Lei Complementar nº 123/2006, Anexos III e V (redação da LC 155/2016) e art. 18 §5º-J"
    url: "https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp123.htm"
    covers: "Simples Nacional bands, nominal rates and deductions; the 28% Fator R rule"
    verified: 2026-09-18
  - label: "Planalto — Lei nº 8.212/1991, arts. 21 e 22"
    url: "https://www.planalto.gov.br/ccivil_03/leis/l8212cons.htm"
    covers: "11% contribuinte individual on the pró-labore; 20% employer INSS"
    verified: 2026-09-18

