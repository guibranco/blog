# Rates and bands for _includes/calculators/contrato-vs-recibos-verdes-pt.html
# (ADR-0015): net income in Portugal under an employment contract (categoria A)
# and under recibos verdes (trabalhador independente, categoria B, regime
# simplificado). A new tax year is a data edit, not a logic edit: bump
# `tax_year`, update the numbers, refresh `sources[].verified`.
#
# Money is in EUR; rates are fractions (0.11 = 11%). Progressive bands are
# listed bottom-up with `up_to` as the top of the band (null = no upper limit)
# and the script charges each slice at its own rate — the "parcela a abater"
# of the official table is the same thing written the other way round.

tax_year: 2026
updated: 2026-09-18

currency: EUR
# Indexante dos Apoios Sociais — Portaria n.º 480-A/2025/1.
ias: 537.13

irs:
  # Art. 68.º CIRS, redação da Lei n.º 73-A/2025 (OE 2026): rendimento
  # coletável, taxa normal.
  brackets:
    - { up_to: 8342,  rate: 0.125 }
    - { up_to: 12587, rate: 0.157 }
    - { up_to: 17838, rate: 0.212 }
    - { up_to: 23089, rate: 0.241 }
    - { up_to: 29397, rate: 0.311 }
    - { up_to: 43090, rate: 0.349 }
    - { up_to: 46566, rate: 0.431 }
    - { up_to: 86634, rate: 0.446 }
    - { up_to: null,  rate: 0.48 }
  # Art. 68.º-A: taxa adicional de solidariedade on the rendimento coletável.
  solidarity:
    - { up_to: 80000,  rate: 0 }
    - { up_to: 250000, rate: 0.025 }
    - { up_to: null,   rate: 0.05 }
  # Art. 25.º n.º 1 a): dedução específica da categoria A = 8,54 × IAS, or the
  # mandatory social contributions when they are higher (n.º 2). The same
  # amount is the floor of the 15% rule for the regime simplificado.
  specific_deduction_ias: 8.54

employee:
  # Subsídio de férias and subsídio de Natal: fourteen payments a year.
  payments: 14
  # Segurança Social, regime geral: worker and employer shares, no ceiling.
  ss_rate: 0.11
  employer_ss_rate: 0.2375

independent:
  # Segurança Social dos trabalhadores independentes: the rate applies to the
  # relevant income — a share of the services invoiced, declared quarterly —
  # with the average monthly relevant income capped at `ss_monthly_cap_ias` ×
  # IAS and a minimum monthly contribution. The first twelve months of a first
  # activity are exempt.
  ss_rate: 0.214
  ss_relevant_share: 0.70
  ss_monthly_cap_ias: 12
  ss_monthly_minimum: 20
  # Art. 31.º CIRS, regime simplificado: coefficient for the professions in the
  # art. 151.º table (programadores, analistas, consultores...), reduced by 50%
  # in the year the activity starts and by 25% in the following one (n.º 10,
  # when there is no category A or H income).
  coefficient: 0.75
  activity_years:
    - { year: 1, coefficient_reduction: 0.50, ss_exempt: true }
    - { year: 2, coefficient_reduction: 0.25, ss_exempt: false }
    - { year: 3, coefficient_reduction: 0,    ss_exempt: false }
  # Art. 31.º n.º 13: the positive difference between this share of the gross
  # and the justified expenses (the dedução específica or the social
  # contributions when higher, plus the activity's invoiced expenses) is added
  # to the taxable income.
  expense_floor_share: 0.15
  # Art. 31.º n.º 2: social contributions above this share of the gross are
  # deductible from the taxable income.
  ss_deductible_over_share: 0.10
  # Art. 101.º n.º 1: withholding on each receipt when the client keeps
  # organised accounts — an advance on the annual IRS, not an extra tax —
  # which can be waived while the year's forecast stays under the CIVA
  # art. 53.º threshold (art. 101.º-B).
  withholding_rate: 0.23
  withholding_dispensed_up_to: 15000
  # IVA charged on top of the receipt and handed to the state; the art. 53.º
  # exemption covers the first year and turnovers under the threshold.
  iva_rate: 0.23
  iva_exempt_up_to: 15000

# Official tables each figure was checked against, with the check date.
sources:
  - label: "Portal das Finanças — CIRS, artigo 68.º (taxas gerais, redação da Lei n.º 73-A/2025)"
    url: "https://info.portaldasfinancas.gov.pt/pt/informacao_fiscal/codigos_tributarios/cirs_rep/Pages/irs68.aspx"
    covers: "The nine 2026 IRS brackets and rates"
    verified: 2026-09-18
  - label: "Portal das Finanças — CIRS, artigo 68.º-A (taxa adicional de solidariedade)"
    url: "https://info.portaldasfinancas.gov.pt/pt/informacao_fiscal/codigos_tributarios/cirs_rep/Pages/irs68a.aspx"
    covers: "2.5% between €80,000 and €250,000, 5% above"
    verified: 2026-09-18
  - label: "Portal das Finanças — CIRS, artigo 25.º (dedução específica da categoria A)"
    url: "https://info.portaldasfinancas.gov.pt/pt/informacao_fiscal/codigos_tributarios/cirs_rep/Pages/irs25.aspx"
    covers: "8,54 × IAS, or the social contributions when higher"
    verified: 2026-09-18
  - label: "Portal das Finanças — CIRS, artigo 31.º (regime simplificado)"
    url: "https://info.portaldasfinancas.gov.pt/pt/informacao_fiscal/codigos_tributarios/cirs_rep/Pages/irs31.aspx"
    covers: "0.75 coefficient, 50%/25% reductions in the first two years, the 15% expense rule, social contributions above 10% deductible"
    verified: 2026-09-18
  - label: "Portal das Finanças — CIRS, artigo 101.º (retenção na fonte)"
    url: "https://info.portaldasfinancas.gov.pt/pt/informacao_fiscal/codigos_tributarios/cirs_rep/Pages/irs101.aspx"
    covers: "23% withholding on the art. 151.º professions"
    verified: 2026-09-18
  - label: "Portal das Finanças — CIVA, artigo 53.º (regime de isenção)"
    url: "https://info.portaldasfinancas.gov.pt/pt/informacao_fiscal/codigos_tributarios/civa_rep/Pages/iva53.aspx"
    covers: "€15,000 turnover threshold, also the ceiling for waiving the IRS withholding (CIRS art. 101.º-B)"
    verified: 2026-09-18
  - label: "Diário da República — Portaria n.º 480-A/2025/1 (IAS 2026)"
    url: "https://diariodarepublica.pt/dr/detalhe/portaria/480-a-2025-993056222"
    covers: "IAS of €537.13 from 1 January 2026"
    verified: 2026-09-18
  - label: "Segurança Social — Trabalhadores por conta de outrem (taxas contributivas)"
    url: "https://www.seg-social.pt/trabalhadores-por-conta-de-outrem"
    covers: "11% worker and 23.75% employer, regime geral"
    verified: 2026-09-18
  - label: "Segurança Social — Trabalhadores independentes (remunerações e contribuições)"
    url: "https://www.seg-social.pt/ptss/pssd/menu/trabalho/remuneracoes-contribuicoes/trabalhadores-independentes"
    covers: "21.4% on 70% of the services invoiced, 12 × IAS cap, €20 minimum, first twelve months exempt"
    verified: 2026-09-18
  - label: "DECO PROteste — Recibos verdes: obrigações para com a Segurança Social"
    url: "https://www.deco.proteste.pt/dinheiro/impostos/noticias/recibos-verdes-obrigacoes-trabalhadores-independentes-seguranca-social"
    covers: "Cross-check of the independent workers' rules with the 2026 IAS values"
    verified: 2026-09-18

