# Default EUR→BRL exchange rate offered in the forms of every Calculator that
# shows a figure in both currencies (ADR-0017): net-salary-ie-br and
# cost-of-living read it, so two of them on one page start from the same
# number. It is only a dated default — readers overwrite it in the form — and
# never a rate the page fetches. `rate` is how many BRL one EUR bought on
# `as_of`, rounded to two decimals to match the form's step.

