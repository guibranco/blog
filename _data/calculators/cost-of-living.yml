# Baselines, sources and UI copy for _includes/calculators/cost-of-living.html
# (ADR-0015, ADR-0019): the monthly cost of one adult's life in Dublin and in
# São Paulo, line by line, and the net pay one city needs to leave what the
# other leaves.
#
# Nothing here is a legal rate. Every figure is a dated market reference —
# what a room or a one-bed costs, a month of groceries, a transport pass, a
# health plan, a full-time crèche place, a modest social life — pre-filled in
# the form so the reader has a starting point, and overridden field by field.
# The basket is the same in both cities so the comparison holds. Money is
# monthly, in the city's currency; `as_of` is the month the references
# describe; each line's derivation is the `basis` note the page prints next
# to it, and `sources[].verified` is when each source was checked. Changing a
# baseline means changing its `basis` note too. The default exchange rate
# comes from shared/fx-eur-brl.yml (ADR-0017).

updated: 2026-09-22
as_of: 2026-09-01

# Net pay pre-filled in the form: what net-salary-ie-br gives for its own
# defaults — €65,000 gross, single, 5% pension, 30–39 → €3,801 a month;
# R$ 15,000 gross, no dependants → R$ 11,067 in a regular month.
defaults:
  net_dublin: 3800
  net_sao_paulo: 11000

# Housing has two references, one per type of home, because the same select
# fills rent and bills for both cities: `shared` is a room in a house or flat
# shared with others, `own` a studio or one-bed for one person.
cities:
  dublin:
    currency: EUR
    housing:
      # Daft.ie Q1 2026: double room in a house, Dublin €914; one-bed apartment,
      # Dublin €2,012 (studio €1,519, two-bed €2,609).
      # Bills (Numbeo, Sept 2026): basic utilities 85 m² €248.59, internet
      # €46.86, mobile €16.57 — shared: half of the first two plus the mobile.
      shared: { rent: 914, utilities: 165 }
      own:    { rent: 2012, utilities: 310 }
    groceries: 350    # ≈ €80 a week for one adult (SalaryAfterTax, Oct 2024)
    transport: 88     # 44 × €2.00 TFI 90-minute fares; the €24 weekly cap would be ≈ €104
    health: 160       # HIA average adult premium €1,902 a year at 1 March 2026 ÷ 12
    childcare: 710    # €260/week (Pobal 2023/24, Dublin–DLR) − €96.30 NCS universal subsidy, × 52 ÷ 12
    leisure: 195      # 4 × €20 meals + 8 × €7 pints + €59.35 gym (Numbeo, Sept 2026)
  sao_paulo:
    currency: BRL
    housing:
      # Room in a shared flat: WebQuarto listings mostly R$ 1,000–1,950 (Sept 2026).
      # One-bed: 35 m² × R$ 91.14/m² (Índice QuintoAndar, July 2026) ≈ R$ 3,200
      # + average condomínio R$ 527 (Cerus, 2026) ≈ R$ 3,700; IPTU on top.
      # Bills (Numbeo, Sept 2026): basic utilities 85 m² R$ 481.54, internet
      # R$ 108.85, mobile R$ 81.07 — shared: half of the first two plus the mobile.
      shared: { rent: 1500, utilities: 375 }
      own:    { rent: 3700, utilities: 670 }
    groceries: 900    # cesta básica de São Paulo, DIEESE/Conab, Aug 2026: R$ 900.59 (one adult, food only)
    transport: 240    # 44 × R$ 5.40 metro fares from 6 Jan 2026; the Bilhete Único Mensal integrado is R$ 411.13
    health: 700       # individual plan, regional, apartamento, 34–38: R$ 550–850 in 2026
    childcare: 3000   # full-time private crèche in São Paulo: most common band R$ 3,000–5,000 (Aug 2026)
    leisure: 475      # 4 × R$ 45 meals + 8 × R$ 15 chopes + R$ 172.64 gym (Numbeo, Sept 2026)

# Where each figure was checked, with the check date. Rents, fares, the
# subsidy and the cesta básica come from the series that publish them; where
# no official series exists (bills, eating out, a health plan, a crèche
# place) the reference is a crowd-sourced or trade figure, named as such.
# The exchange rate source is listed in shared/fx-eur-brl.yml.
sources:
