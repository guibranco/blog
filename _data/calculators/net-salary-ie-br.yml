# Rates and bands for _includes/calculators/net-salary-ie-br.html (ADR-0015).
#
# Everything the calculator needs for the Irish side lives here, so a new tax
# year is a data edit, not a logic edit: bump `tax_year`, update the numbers,
# refresh `sources[].verified`. The Brazilian CLT tables are shared with the
# CLT × PJ calculator and live in shared/brazil-clt.yml (ADR-0017). The
# include renders both as the static fallback and hands them to the script.
#
# Money is in the country's currency; rates are fractions (0.2 = 20%).
# Progressive bands are listed bottom-up with `up_to` as the top of the band
# (null = no upper limit).

tax_year: 2026
updated: 2026-09-17

fx:
  # Default EUR→BRL rate offered in the form; readers can overwrite it.
  eur_brl: 5.91
  as_of: 2026-09-17

ireland:
  currency: EUR
  income_tax:
    rates:
      standard: 0.20
      higher: 0.40
    # Standard rate cut-off point (income taxed at 20% up to this amount).
    bands:
      single: 44000
      single_parent: 48000
      married_one_income: 53000
    # Annual tax credits, subtracted from the tax computed on the bands.
    credits:
      personal_single: 2000
      personal_married: 4000
      employee: 2000
      single_person_child_carer: 1900
  usc:
    # No USC at all when total income is at or below this amount.
    exempt_up_to: 13000
    bands:
      - { up_to: 12012, rate: 0.005 }
      - { up_to: 28700, rate: 0.02 }
      - { up_to: 70044, rate: 0.03 }
      - { up_to: null,  rate: 0.08 }
  prsi:
    class: A
    # Employee rate changes on 1 October each year under the PRSI roadmap;
    # the calculator blends the periods by their share of days in the year.
    periods:
      - { from: 2026-01-01, to: 2026-09-30, rate: 0.042 }
      - { from: 2026-10-01, to: 2026-12-31, rate: 0.0435 }
    # No employee PRSI when weekly pay is at or below this amount.
    weekly_threshold: 352
    # Weekly credit of `max`, reduced by one sixth of pay over `weekly_threshold`
    # (+0.01), gone once weekly pay exceeds `taper_upper`.
    credit:
      max: 12
      taper_upper: 424
  pension:
    # Employee contributions get income tax relief only (no USC/PRSI relief),
    # limited to an age-based share of earnings, earnings capped at earnings_cap.
    earnings_cap: 115000
    age_limits:
      - { max_age: 29,   pct: 0.15 }
      - { max_age: 39,   pct: 0.20 }
      - { max_age: 49,   pct: 0.25 }
      - { max_age: 54,   pct: 0.30 }
      - { max_age: 59,   pct: 0.35 }
      - { max_age: null, pct: 0.40 }

# Official tables each figure was checked against, with the check date. The
# Brazilian sources are listed in shared/brazil-clt.yml.
sources:
  - label: "Revenue — Tax rates, bands and reliefs (2026)"
    url: "https://www.revenue.ie/en/personal-tax-credits-reliefs-and-exemptions/tax-relief-charts/index.aspx"
    covers: "Irish income tax bands and credits"
    verified: 2026-09-17
  - label: "Revenue — Standard rates and thresholds of USC (2026)"
    url: "https://www.revenue.ie/en/jobs-and-pensions/usc/standard-rates-thresholds.aspx"
    covers: "USC bands"
    verified: 2026-09-17
  - label: "gov.ie — Advance notice for 2026: PRSI changes"
    url: "https://assets.gov.ie/static/documents/b9146265/20251008_Advance_Notice_2026_Final.pdf"
    covers: "PRSI Class A employee rates and the 1 October 2026 increase"
    verified: 2026-09-17
  - label: "Citizens Information — Paying social insurance (PRSI)"
    url: "https://www.citizensinformation.ie/en/social-welfare/irish-social-welfare-system/social-insurance-prsi/paying-social-insurance/"
    covers: "€352 weekly threshold and the tapered €12 PRSI credit"
    verified: 2026-09-17
  - label: "Revenue — Tax relief on pension contributions"
    url: "https://www.revenue.ie/en/jobs-and-pensions/pension/relief/index.aspx"
    covers: "Age-related limits, €115,000 cap, no USC/PRSI relief"
    verified: 2026-09-17

