  - id: bs2
    date: "2019"
    type: job
    company: "Banco BS2"
    company_url: "https://www.bs2.com"
    date_label: { pt: "2019 – 2021", en: "2019 – 2021" }
    location: { pt: "São Paulo, Brasil (remoto)", en: "São Paulo, Brazil (remote)" }
    title:
      pt: "Banco BS2 — engenharia no core bancário"
      en: "Banco BS2 — core banking engineering"
    description:
      pt: "Entrei como Senior Software Engineer via K2 Partnering. Em março de 2020 saí de um time B2B em São Paulo para o time de projetos especiais do core bancário — a mesa onde o PIX seria construído."
      en: "Joined as a Senior Software Engineer via K2 Partnering. In March 2020 I moved from a B2B team in São Paulo to the core-banking special-projects team — the desk where PIX would be built."
    technologies: [".NET", "C#", "RabbitMQ", "SQL Server", "CouchDB"]
    motivation:
      pt: "Sair de integrações B2B para o núcleo transacional de um banco era o passo que faltava para trabalhar com sistemas de consequência real."
      en: "Moving from B2B integrations into a bank's transactional core was the missing step toward systems where mistakes have real consequences."
    lessons:
      pt: "Prazo regulatório inegociável, especificação em movimento e erro com custo real: aprendi mais por unidade de tempo aqui do que em qualquer outro lugar no Brasil."
      en: "A non-negotiable regulatory deadline, a moving spec and mistakes with real cost: I learned more per unit of time here than anywhere else in Brazil."
    outcome:
      pt: "Um mês depois do lançamento do PIX, aceitei o primeiro contrato com uma empresa fora do Brasil."
      en: "A month after PIX went live, I signed my first contract with a company outside Brazil."

  - id: pix
    date: "2020"
    type: milestone
    featured: true
    company: "Banco BS2"
    date_label: { pt: "2020", en: "2020" }
    title:
      pt: "Construir o PIX, com data marcada pelo Banco Central"
      en: "Building PIX, on a deadline set by Brazil's Central Bank"
    description:
      pt: "Atravessei 2020 dentro do projeto do PIX: mensageria ISO 20022 sobre a RSFN, o Manual de Tempos com latência auditada por percentil, e um lançamento marcado para 16 de novembro sem plano B. BS2 foi a primeira instituição financeira digital totalmente homologada pelo Bacen para o PIX."
      en: "I spent 2020 inside the PIX project: ISO 20022 messaging over the RSFN network, a spec with latency audited by percentile, and a launch fixed for November 16th with no plan B. BS2 was the first digital financial institution fully certified by the Central Bank for PIX."
    technologies: [".NET", "RabbitMQ", "SQL Server", "ISO 20022"]
    links:
      - label: { pt: "Série: Desenvolvendo o PIX (1) — bastidores do prazo", en: "Series: Building PIX (1) — behind the deadline" }
        url: "/artigos/construindo-o-pix-no-bs2-bastidores-de-um-prazo-do-banco-central/"
      - label: { pt: "Série: Desenvolvendo o PIX (2) — o contrato", en: "Series: Building PIX (2) — the contract" }
        url: "/artigos/contrato-do-pix-valor-fixo-sobreaviso-e-a-hora-que-nao-existia/"
      - label: { pt: "Série: Desenvolvendo o PIX (3) — a arquitetura", en: "Series: Building PIX (3) — the architecture" }
        url: "/artigos/arquitetura-do-pix-por-dentro-spi-iso-20022-dez-segundos/"
    motivation:
      pt: "Ninguém tinha construído o PIX antes porque o sistema não existia nesse formato em lugar nenhum do mundo. A chance de fazer parte disso não ia se repetir."
      en: "Nobody had built PIX before because the system didn't exist in that shape anywhere in the world. The chance to be part of it wasn't going to come again."
    lessons:
      pt: "Arquitetura sob orçamento de tempo publicado em norma muda tudo: a latência aceitável não é opinião, é contrato."
      en: "Architecture under a time budget published in regulation changes everything: acceptable latency isn't an opinion, it's a contract."
    outcome:
      pt: "A confiança para aceitar trabalho no exterior veio, em boa parte, de ter atravessado 2020 dentro do core de um banco."
      en: "Much of the confidence to take work abroad came from having gotten through 2020 inside a bank's core."

  - id: farfetch
    date: "2020-12"
