      en: "Senior engineer on Farfetch's <strong>Search &amp; Scouts</strong> team, a global luxury-fashion platform — improving the search services, working side by side with the Data Science team. Through the Portuguese consultancy Multivision; a move to Porto was part of the deal and never happened."
