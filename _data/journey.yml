      pt: "Ninguém tinha construído o PIX antes porque o sistema não existia nesse formato em lugar nenhum do mundo."
      en: "Nobody had built PIX before, because the system didn't exist in that shape anywhere in the world."
    lessons:
      pt: "Arquitetura sob um orçamento de tempo publicado em norma muda tudo: a latência aceitável não é opinião, é contrato."
      en: "Architecture under a time budget published in regulation changes everything: acceptable latency isn't an opinion, it's a contract."
    outcome:
      pt: "A confiança para aceitar trabalho no exterior veio, em boa parte, de ter atravessado 2020 dentro do core de um banco."
      en: "Much of the confidence to take work abroad came from getting through 2020 inside a bank's core."

