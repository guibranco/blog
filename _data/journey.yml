    motivation:
      pt: "Era a primeira vez que uma empresa fora do Brasil me contratava. O plano de mudança para o Porto fazia parte do pacote."
      en: "It was the first time a company outside Brazil hired me. A planned move to Porto was part of the package."
    lessons:
      pt: "Contrato internacional e relocation são coisas separadas: um pode existir plenamente sem o outro nunca acontecer."
      en: "An international contract and relocation are separate things: one can fully exist while the other never happens."

