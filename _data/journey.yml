    description:
      pt: "Contratado via LinkedIn pela consultoria portuguesa Multivision, em regime de recibos verdes, para o cluster de Search da Farfetch. No papel, modelo híbrido no Porto; na prática, seis meses inteiros remotos de São Paulo. Pedi demissão sem nunca ter pisado em Portugal."
      en: "Hired via LinkedIn by the Portuguese consultancy Multivision, as an independent contractor, for Farfetch's Search cluster. On paper, a hybrid role in Porto; in practice, six fully remote months from São Paulo. I resigned without ever setting foot in Portugal."
    technologies: ["C#", ".NET", "Elasticsearch", "Kafka", "Cassandra"]
    links:
      - label: { pt: "Trabalhando pelo mundo #1 — Porto", en: "Working around the world #1 — Porto" }
