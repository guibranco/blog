  - id: parallel-2021
    date: "2021-03"
    type: milestone
    featured: true
    date_label: { pt: "2021", en: "2021" }
    title:
      pt: "O ano dos contratos paralelos"
      en: "The year of parallel contracts"
    description:
      pt: "2021 teve, em poucos meses, contratos remotos emendados ou simultâneos: BS2 até janeiro, Farfetch em tempo integral até maio e, em paralelo, Grace Kennedy, FCamara e Syndigo em meio período — com a Talabat, em Dubai, começando em maio."
      en: "In a few months, 2021 held remote contracts back-to-back or at once: BS2 until January, Farfetch full-time until May, and in parallel Grace Kennedy, FCamara and Syndigo part-time — with Talabat, in Dubai, starting in May."
    motivation:
      pt: "Depois de sete anos numa empresa só, testei o extremo oposto: quantos contextos eu conseguia sustentar ao mesmo tempo."
      en: "After seven years at one company, I tried the opposite extreme: how many contexts I could hold at once."
    lessons:
      pt: "Dá para acumular contratos por um tempo, mas o custo aparece na troca de contexto e na energia. Não serve como estilo de vida."
      en: "You can stack contracts for a while, but the cost shows up in context-switching and energy. It doesn't work as a way of living."

