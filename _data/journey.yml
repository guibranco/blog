# =============================================================================
#  journey.yml — content source for the "Minha trajetória / My journey" page
#  (rendered by /trajetoria/  ->  journey.html)
# -----------------------------------------------------------------------------
#  CONTENT vs PRESENTATION
#  - This file holds only CONTENT. Layout lives in journey.html, styles in
#    assets/css/main.css (.journey* rules), page-chrome strings in
#    _data/i18n.yml (journey_* keys, swapped client-side by lang-switcher.js).
#  - Every reader-facing string is bilingual: `pt` = Portuguese (pt-BR),
#    `en` = English. journey.html renders pt visible + en hidden; the switcher
#    flips them. With JavaScript off, the pt text shows.
#
#  ADDING / EDITING AN EVENT
#  - Append to `events:`. No template change needed.
#  - `date` is a sortable string ("YYYY" or "YYYY-MM") and also sets the
#    left-to-right position. `date_label` overrides the displayed text.
#  - Required: id, date, type, title. Everything else is optional.
#  - `type` must match a `categories[].id`.
#  - `featured: true` -> stronger visual weight (accent border, star node).
#
#  SOURCE OF FACTS
#  - The timeline is built from the CV data in the sibling repo
#    guibranco.github.io (src/data/work-experience.json, education.json,
#    experience-years.json, projects.json, personal-private-projects.json)
#    plus the blog's own posts. Company/school logos were copied from that
#    repo into assets/img/journey/.
# =============================================================================

# --- Event categories --------------------------------------------------------
categories:
  - id: first-contact
    icon: "fas fa-power-off"
    label: { pt: "Primeiro contato", en: "First contact" }
  - id: education
    icon: "fas fa-graduation-cap"
    label: { pt: "Formação", en: "Education" }
  - id: project
    icon: "fas fa-code-branch"
    label: { pt: "Projetos", en: "Projects" }
  - id: job
    icon: "fas fa-briefcase"
    label: { pt: "Trabalho", en: "Job" }
  - id: milestone
    icon: "fas fa-flag-checkered"
    label: { pt: "Marco", en: "Milestone" }
  - id: move
    icon: "fas fa-plane-departure"
    label: { pt: "Mudança de país", en: "Relocation" }
  - id: blog
    icon: "fas fa-feather-pointed"
    label: { pt: "Blog", en: "Blog" }

# --- Timeline events (sorted ascending by `date` at render time) -------------
events:

  - id: first-html
    date: "2004"
    type: first-contact
    date_label: { pt: "2004 (13 anos)", en: "2004 (age 13)" }
    title:
      pt: "As primeiras linhas: a página de erro do Internet Explorer"
      en: "The first lines: Internet Explorer's error page"
    description:
      pt: "No fim dos 13 anos, ainda no fundamental 2 (8ª série), aprendi a editar o HTML da página de erro do Internet Explorer no laboratório de informática do INSA. Foi ali que comecei a programar de verdade."
      en: "At the tail end of being 13, still in middle school (8th grade), I learned to edit the HTML of Internet Explorer's error page in my school's computer lab. That's where I actually started programming."
    technologies: ["HTML"]
    motivation:
      pt: "Eu já rondava comunidades de hacker e segurança no Orkut e comentava esse interesse abertamente — o bastante para, pouco antes disso, eu ter sido acusado (injustamente) de invadir e difamar a conta de uma colega mais nova, e quase expulso tanto da escola quanto da escola de inglês por causa disso. Nunca fiz aquilo, mas o episódio só aumentou meu interesse pela área."
      en: "I was already hanging around hacker and security communities on Orkut and talked about that interest openly — enough that, shortly before this, I was (wrongly) accused of hacking and defaming a younger classmate's account, and almost expelled from both my school and my English school over it. I never did it, but the episode only deepened my interest in the field."
    lessons:
      pt: "A curiosidade por segurança veio antes de eu saber programar — o código só chegou depois, para acompanhar o interesse."
      en: "The curiosity about security came before I could code — the code only arrived afterwards, to keep up with the interest."

  - id: tech-course
    date: "2005"
    type: first-contact
    company: "SOS Computadores"
    logo: /assets/img/journey/soscomputadores.png
    location: { pt: "São Paulo, Brasil", en: "São Paulo, Brazil" }
