      pt: "Um freela sem contrato nem cliente direto é fácil de levar calote — e o calote pode vir do outro freelancer, não só do cliente final."
      en: "A freelance gig with no contract and no direct client is easy to get stiffed on — and the non-payment can come from the other freelancer, not just the end client."

