# =============================================================================
#  journey.yml — content source for the "Minha trajetória / My journey" page
#  (rendered by /trajetoria/  ->  journey.html)
# -----------------------------------------------------------------------------
#  CONTENT vs PRESENTATION
#  - This file holds only CONTENT. All layout/markup lives in journey.html and
#    the styles in assets/css/main.css (.journey* rules).
#  - Page CHROME strings (headings, button labels, section labels) live in
#    _data/i18n.yml under the `journey_*` keys and are swapped client-side by
#    assets/js/lang-switcher.js — the same mechanism the rest of the site uses.
#  - Every reader-facing string here is bilingual: `pt` = Portuguese (pt-BR),
#    `en` = English. journey.html renders the pt text visible and the en text
#    hidden; lang-switcher.js flips them when the UI language changes. With
#    JavaScript disabled the Portuguese text (the site default) is shown.
#
#  ADDING A NEW EVENT
#  - Append an item to `events:` below. No template change is required.
#  - `date` must be a sortable string: "YYYY" or "YYYY-MM". Events are sorted
#    ascending by `date`, so that value also decides horizontal position.
#  - Only `id`, `date`, `type` and `title` are required. Everything else is
#    optional — omit a key and that part of the card simply isn't rendered.
#  - `type` must match one of the ids in `categories:` below.
#  - Set `featured: true` on the handful of turning-point events — they get
#    stronger visual weight (accent border, larger node, star marker).
#  - Set `placeholder: true` while an event still needs your real history —
#    it renders with a visible "to be completed" badge so nothing looks final.
#
#  IMAGES / LOGOS
#  - Reuse assets already in assets/img/ — do not add duplicates.
#  - There is currently NO company-logo folder in the repo. When you have real
#    logos, add them under assets/img/journey/ and point `logo:` at them.
#  - `logo` / `screenshot` are site-absolute paths (e.g. /assets/img/…). They
#    are passed through `relative_url` in the template, so no baseurl prefix.
#
#  LINKS
#  - `links:` are related blog posts or external references (site-absolute or
#    full URL). `repo:` / `projects[].url` are GitHub URLs — only real ones.
# =============================================================================

# --- Event categories --------------------------------------------------------
