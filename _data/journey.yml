      en: "A 260-hour technical course at SOS Computadores: assembling and maintaining PCs, installing and configuring networks. In parallel, English at CNA (2004–2009) — the base that made an international career possible years later."
    motivation:
      pt: "Hardware e redes vieram antes do código: entender a máquina por dentro foi o primeiro passo."
      en: "Hardware and networking came before code: understanding the machine itself was step one."

  - id: first-projects
    date: "2005"
    type: project
    title:
      pt: "Páginas estáticas e o primeiro sistema de login"
      en: "Static pages and the first login system"
    description:
      pt: "Antes de qualquer projeto \"de verdade\", os primeiros códigos eram scripts soltos de ajuda para os fóruns e comunidades das quais eu participava. Logo depois vieram os primeiros projetos: páginas estáticas e, na sequência, um sistema de login — tudo nas tecnologias que vinham empacotadas com o Dreamweaver: ASP Classic, ColdFusion e PHP."
      en: "Before any \"real\" project, the first bits of code were loose helper scripts for the forums and communities I was part of. Then came the first actual projects: static pages, followed by a login system — all in the technologies bundled with Dreamweaver: ASP Classic, ColdFusion and PHP."
    technologies: ["ASP Classic", "ColdFusion", "PHP", "Dreamweaver"]

  - id: html-brasil
    date: "2006"
    type: milestone
    title:
      pt: "Moderador da comunidade HTML Brasil, no Orkut"
      en: "Moderator of the HTML Brasil community, on Orkut"
    description:
      pt: "Cheguei a moderador da <strong>HTML Brasil</strong>, a segunda maior comunidade de desenvolvimento web do Orkut — atrás só da PHP Brasil. A divisão etária era nítida: adultos na PHP Brasil, crianças e adolescentes na HTML Brasil. Quase todos os moderadores e admins tinham menos de 16 anos."
      en: "I became a moderator of <strong>HTML Brasil</strong>, the second-biggest web-development community on Orkut — behind only PHP Brasil. The age split was obvious: adults in PHP Brasil, kids and teenagers in HTML Brasil. Almost every moderator and admin was under 16."
    outcome:
      pt: "Também começamos o projeto de um portal para a comunidade, nos moldes do iMasters ou do Script Brasil — para publicar notícias e tutoriais de desenvolvimento. Fiquei responsável pelo backend; o frontend era de outra pessoa. O site nunca foi ao ar."
      en: "We also started a portal project for the community, along the lines of iMasters or Script Brasil — for publishing development news and tutorials. I was responsible for the backend; the frontend was someone else's work. The site never launched."

