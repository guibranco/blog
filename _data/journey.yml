      en: "I spent 2020 inside PIX/SPI: architecture of the CORE and Indirect PIX solutions at BS2, ISO 20022 messaging (ADMI, CAMT, PACS, REDA), an accounting system for Indirect PIX partners, and a launch fixed for November 16th with no plan B."
