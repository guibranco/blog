<text x="356" y="362" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="9" fill="#5a534a">broadcast de cada entrada salva</text>
<path d="M480,196 L480,206" fill="none" stroke="#8a8078" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-light)"/>
