<text x="702" y="172" text-anchor="start" font-family="Source Serif 4, Georgia, serif" font-size="13" font-weight="600" fill="#1a1714">logstream-ui</text>
<text x="702" y="188" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="9" fill="#8a8078">React · Vite · TypeScript</text>
<text x="702" y="210" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="9" fill="#5a534a">live tail com pausa</text>
<text x="702" y="225" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="9" fill="#5a534a">filtros: app, nível, trace,</text>
<text x="702" y="240" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="9" fill="#5a534a">batch, contexto, template</text>
<text x="702" y="255" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="9" fill="#5a534a">16 temas · claro e escuro</text>
<text x="702" y="270" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="9" fill="#5a534a">chave só de leitura</text>
<path d="M610,356 L650,356 L650,260 L688,260" fill="none" stroke="#2d6a4f" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-green)"/>
