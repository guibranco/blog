<text x="32" y="131" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="9" fill="#5a534a">GStraccini-bot · API BR</text>
<text x="32" y="146" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="9" fill="#5a534a">Projects Monitor</text>
