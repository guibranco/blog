<text x="356" y="223" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="600" fill="#1a1714">Storage</text>
<text x="356" y="238" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="9" fill="#5a534a">MariaDB — índices, FULLTEXT no contexto</text>
<text x="356" y="252" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="9" fill="#5a534a">file — JSONL por dia (demo / restrito)</text>
