<text x="356" y="300" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="9" fill="#5a534a">políticas por nível, app, idade,</text>
<text x="356" y="314" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="9" fill="#5a534a">regex ou glob · a cada 24h</text>
