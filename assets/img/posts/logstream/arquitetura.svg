<text x="32" y="217" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="9" fill="#5a534a">WebhooksHandler</text>
<text x="32" y="232" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="9" fill="#5a534a">(futuro: sink Serilog)</text>
