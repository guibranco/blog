<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 400" width="1040" height="400" role="img" aria-label="Linha do tempo das ferramentas de log: projetos pessoais desde o fim de 2006 e freelas desde 2008, com echo e error_log; Inovação de 2011 a 2018 como funcionário e até 2021 como freelancer, com Redis, RabbitMQ, Elasticsearch e UI em React; CrispyWaffle open source desde 2019; Serilog no BS2 de 2019 a 2021; Seq na Farfetch, Talabat e OUTsurance desde o fim de 2020; Projects Monitor com o scanner de error_log; e o LogStream em 2026.">
