<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Linha do tempo das ferramentas de log: echo e error_log nos freelas; na Inovação, de 2011 a 2018, mensagens estruturadas em Redis, RabbitMQ e Elasticsearch com uma UI em React; o CrispyWaffle open source desde 2019 com providers plugáveis; Serilog e Seq de 2020 a 2026 na Farfetch, Talabat e OUTsurance; o Projects Monitor com o scanner de error_log; e o LogStream em 2026.">
<defs>
<marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a534a"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2d6a4f"/></marker>
<marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b85c00"/></marker>
<marker id="a-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8078"/></marker>
</defs>
<rect width="900" height="400" fill="#f5f0e8"/>
<text x="20" y="26" text-anchor="start" font-family="Source Serif 4, Georgia, serif" font-size="15" font-weight="600" fill="#1a1714">Vinte anos procurando erro — de onde vem o LogStream</text>
<text x="20" y="44" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#5a534a">cada etapa deixou uma ideia; nenhuma foi copiada inteira</text>
<line x1="20" y1="56" x2="880" y2="56" stroke="#d8cfc2" stroke-width="1"/>
<line x1="85" y1="120" x2="815" y2="120" stroke="#d8cfc2" stroke-width="2"/>
<circle cx="85.0" cy="120" r="6" fill="#8a8078"/>
<text x="85.0" y="102" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#5a534a">antes de 2011</text>
<rect x="21.0" y="146" width="128" height="85" rx="6" fill="#ffffff" stroke="#d8cfc2" stroke-width="1"/>
<line x1="85.0" y1="128" x2="85.0" y2="146" stroke="#d8cfc2" stroke-width="1"/>
<text x="85.0" y="168" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="11.5" font-weight="600" fill="#1a1714">Freelas</text>
<text x="85.0" y="188" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.8" fill="#5a534a">echo · print_r</text>
<text x="85.0" y="203" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.8" fill="#5a534a">error_log no</text>
<text x="85.0" y="218" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.8" fill="#5a534a">servidor</text>
<circle cx="231.0" cy="120" r="6" fill="#b85c00"/>
<text x="231.0" y="102" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#b85c00">2011–2018</text>
<rect x="167.0" y="146" width="128" height="100" rx="6" fill="#ffffff" stroke="#d8cfc2" stroke-width="1"/>
<line x1="231.0" y1="128" x2="231.0" y2="146" stroke="#d8cfc2" stroke-width="1"/>
<text x="231.0" y="168" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="11.5" font-weight="600" fill="#1a1714">Inovação</text>
<text x="231.0" y="188" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.8" fill="#5a534a">Redis pub/sub</text>
<text x="231.0" y="203" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.8" fill="#5a534a">RabbitMQ</text>
<text x="231.0" y="218" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.8" fill="#5a534a">Elasticsearch</text>
<text x="231.0" y="233" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.8" fill="#5a534a">UI em React</text>
<circle cx="377.0" cy="120" r="6" fill="#b85c00"/>
<text x="377.0" y="102" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#b85c00">2019 →</text>
<rect x="313.0" y="146" width="128" height="85" rx="6" fill="#ffffff" stroke="#d8cfc2" stroke-width="1"/>
<line x1="377.0" y1="128" x2="377.0" y2="146" stroke="#d8cfc2" stroke-width="1"/>
<text x="377.0" y="168" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="11.5" font-weight="600" fill="#1a1714">CrispyWaffle</text>
<text x="377.0" y="188" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.8" fill="#5a534a">LogMessage</text>
<text x="377.0" y="203" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.8" fill="#5a534a">providers plugáveis</text>
<text x="377.0" y="218" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.8" fill="#5a534a">open source</text>
<circle cx="523.0" cy="120" r="6" fill="#b85c00"/>
<text x="523.0" y="102" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#b85c00">2020–2026</text>
<rect x="459.0" y="146" width="128" height="85" rx="6" fill="#ffffff" stroke="#d8cfc2" stroke-width="1"/>
<line x1="523.0" y1="128" x2="523.0" y2="146" stroke="#d8cfc2" stroke-width="1"/>
<text x="523.0" y="168" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="11.5" font-weight="600" fill="#1a1714">Serilog · Seq</text>
<text x="523.0" y="188" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.8" fill="#5a534a">Farfetch · Talabat</text>
<text x="523.0" y="203" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.8" fill="#5a534a">OUTsurance</text>
<text x="523.0" y="218" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.8" fill="#5a534a">message templates</text>
<circle cx="669.0" cy="120" r="6" fill="#8a8078"/>
<text x="669.0" y="102" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#5a534a">até 2026</text>
<rect x="605.0" y="146" width="128" height="85" rx="6" fill="#ffffff" stroke="#d8cfc2" stroke-width="1"/>
<line x1="669.0" y1="128" x2="669.0" y2="146" stroke="#d8cfc2" stroke-width="1"/>
<text x="669.0" y="168" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="11.5" font-weight="600" fill="#1a1714">Projects Monitor</text>
<text x="669.0" y="188" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.8" fill="#5a534a">scanner de error_log</text>
<text x="669.0" y="203" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.8" fill="#5a534a">tabela messages</text>
<text x="669.0" y="218" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.8" fill="#5a534a">(hoje: fallback)</text>
<circle cx="815.0" cy="120" r="8" fill="#2d6a4f"/>
<text x="815.0" y="102" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#2d6a4f">2026</text>
<rect x="751.0" y="146" width="128" height="85" rx="6" fill="#e8f5ee" stroke="#2d6a4f" stroke-width="1"/>
<line x1="815.0" y1="128" x2="815.0" y2="146" stroke="#d8cfc2" stroke-width="1"/>
<text x="815.0" y="168" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="11.5" font-weight="600" fill="#1a1714">LogStream</text>
<text x="815.0" y="188" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.8" fill="#5a534a">PHP + React</text>
<text x="815.0" y="203" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.8" fill="#5a534a">chave por app</text>
<text x="815.0" y="218" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.8" fill="#5a534a">retenção · live tail</text>
<line x1="20" y1="286" x2="880" y2="286" stroke="#d8cfc2" stroke-width="1"/>
<text x="20" y="304" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="9" fill="#8a8078">O QUE CADA ETAPA DEIXOU</text>
<text x="20" y="326" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="600" fill="#b85c00">Inovação</text>
<text x="150" y="326" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#1a1714">mensagem estruturada &gt; texto solto; mas sem busca boa, voltava-se ao arquivo de texto</text>
<text x="20" y="343" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="600" fill="#b85c00">CrispyWaffle</text>
<text x="150" y="343" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#1a1714">o produtor não deve saber para onde o log vai — providers trocáveis</text>
<text x="20" y="360" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="600" fill="#b85c00">Seq</text>
<text x="150" y="360" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#1a1714">message templates e propriedades pesquisáveis mudam a forma de investigar</text>
<text x="20" y="377" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="600" fill="#b85c00">Projects Monitor</text>
<text x="150" y="377" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#1a1714">ler error_log resolve o passado; erro transacional precisa nascer estruturado</text>
</svg>
