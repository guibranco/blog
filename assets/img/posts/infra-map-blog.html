<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infrastructure Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* ---- LIGHT (default) — blog cream palette ---- */
    --bg:        #faf9f6;
    --panel:     #ffffff;
    --panel-2:   #f2ede6;
    --line:      #e2dbd0;
    --text:      #1a1714;
    --muted:     #5a534a;
    --wine:      #a23c58;   /* external / public traffic */
    --vine:      #2d6a4f;   /* internal / healthy (blog green) */
    --amber:     #b85c00;   /* queue / pending (blog amber) */
    --down:      #c0392b;
    --log:       #7a52a0;   /* log shipping */
    --sky:       #3d7f9a;   /* vpn / control */
    --shadow:    rgba(80,60,40,.12);
  }
  :root[data-theme="dark"]{
    /* ---- DARK — blog dark palette ---- */
    --bg:        #15130f;
    --panel:     #1c1912;
    --panel-2:   #211d15;
    --line:      #453f35;
    --text:      #e8e3da;
    --muted:     #b0a99c;
    --wine:      #d97596;   /* external / public traffic */
    --vine:      #5fb98b;   /* internal / healthy (blog green) */
    --amber:     #e08a3c;   /* queue / pending (blog amber) */
    --down:      #e06a5c;
    --log:       #b596d6;   /* log shipping */
    --sky:       #7fb3c8;   /* vpn / control */
    --shadow:    rgba(0,0,0,.4);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15130f; --panel:#1c1912; --panel-2:#211d15; --line:#453f35;
      --text:#e8e3da; --muted:#b0a99c; --wine:#d97596; --vine:#5fb98b;
      --amber:#e08a3c; --down:#e06a5c; --log:#b596d6; --sky:#7fb3c8;
      --shadow:rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:'JetBrains Mono',ui-monospace,monospace;}
  header{display:flex;align-items:baseline;justify-content:space-between;
    flex-wrap:wrap;gap:.5rem 2rem;padding:28px 40px 6px;}
  h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;
    font-size:clamp(22px,3.2vw,34px);letter-spacing:-.02em;margin:0;}
  h1 .accent{color:var(--amber)}
  .stamp{font-size:12px;color:var(--muted)}
  .legend{display:flex;gap:1.4rem;flex-wrap:wrap;padding:4px 40px 10px;
    font-size:11px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:.45em}
  .swatch{width:22px;height:0;border-top:2px dashed}
  .dot{width:8px;height:8px;border-radius:50%}
  #map{display:block;width:100%;height:auto;padding:0 12px 24px}
  svg text{font-family:'JetBrains Mono',ui-monospace,monospace}
  .grp-label{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;
    font-size:15px;letter-spacing:.14em;text-transform:uppercase;fill:var(--muted)}
  .grp-label.sm{font-size:11.5px;letter-spacing:.08em}
  .node rect{fill:var(--panel);stroke:var(--line);stroke-width:1.2;rx:10}
  .node.planned rect{stroke-dasharray:5 4;fill-opacity:.55}
  .node.planned .title{opacity:.75}
  .node:hover rect{stroke:var(--text)}
  .node .title{font-size:13.5px;font-weight:700;fill:var(--text)}
  svg .sub{font-size:10.5px;fill:var(--muted)}
  .edge path{fill:none;stroke-width:1.6;stroke-dasharray:6 7;
    animation:flow 1.1s linear infinite}
  .edge.mon path, .edge.log path, .edge.proxy path, .edge.pub path{stroke-width:1;stroke-dasharray:2 6;opacity:.18;
    animation-duration:2.6s}
  .edge.hot path{opacity:1}
  .edge.mon.hot path, .edge.log.hot path, .edge.proxy.hot path, .edge.pub.hot path{opacity:.85;stroke-width:1.4}
  .edge text{font-size:9.5px;fill:var(--muted)}
  .edge.dim path,.node.dim{opacity:.14}
  .edge,.node{transition:opacity .25s}
  @keyframes flow{to{stroke-dashoffset:-13}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .status{animation:pulse 2.2s ease-in-out infinite}
  @media (prefers-reduced-motion: reduce){
    .edge path{animation:none}
    .status{animation:none}
    .particle{display:none}
  }
  footer{padding:0 40px 32px;font-size:11px;color:var(--muted);max-width:70ch}
  footer code{color:var(--vine)}
  .domband{font-size:9.5px;fill:var(--sky);cursor:pointer}
  .node.hasdom{cursor:pointer}
  #pop{position:fixed;display:none;background:var(--panel-2);
    border:1px solid var(--line);border-radius:10px;padding:10px 14px;
    font-size:12px;z-index:10;max-width:300px;
    box-shadow:0 8px 24px rgba(0,0,0,.5)}
  #pop h4{margin:0 0 6px;font-family:'Bricolage Grotesque',sans-serif;
    font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);font-weight:600}
  #pop a{display:block;color:var(--sky);text-decoration:none;padding:2px 0}
  #pop a:hover{text-decoration:underline}
</style>
</head>
<body>
<header>
  <h1>Infrastructure <span class="accent">Map</span></h1>
  <div style="display:flex;align-items:center;gap:1rem;">
    <button id="themeToggle" aria-label="Toggle light/dark theme"
      style="background:var(--panel-2);color:var(--muted);border:1px solid var(--line);
      border-radius:8px;padding:6px 12px;font-family:inherit;font-size:12px;cursor:pointer;">◐ theme</button>
    <div class="stamp" id="stamp"></div>
  </div>
</header>
<div class="legend">
  <span><i class="swatch" style="border-color:var(--wine)"></i> external / public traffic</span>
  <span><i class="swatch" style="border-color:var(--vine)"></i> internal calls & data</span>
  <span><i class="swatch" style="border-color:var(--sky)"></i> VPN / control</span>
  <span><i class="swatch" style="border-color:var(--amber)"></i> message queue (AMQP)</span>
  <span><i class="swatch" style="border-color:var(--muted);opacity:.6"></i> monitoring probes</span>
  <span><i class="swatch" style="border-color:var(--log);opacity:.7"></i> log shipping</span>
  <span><i class="swatch" style="border-color:var(--sky)"></i> UI → API</span>
  <span><i class="swatch" style="border-color:var(--vine);opacity:.5"></i> NGINX → service</span>
  <span><i class="dot" style="background:var(--vine)"></i> running</span>
  <span><i class="dot" style="background:var(--amber)"></i> planned / empty / late</span>
  <span><i class="dot" style="background:var(--down)"></i> down</span>
</div>
<svg id="map" viewBox="0 0 1400 2180" xmlns="http://www.w3.org/2000/svg" aria-label="Infrastructure map"></svg>

     mode: 'off' | 'badges' | 'api' | 'file'

             this page, so only use on a private/VPN-only host
     file:   same-origin status.json written by a cron job (safest)
     In api/file modes, checks are matched to nodes by slug or tag
     equal to the node id (or an optional  check:'...'  on the node).
  ------------------------------------------------------------------ */

/* ============================ renderer ============================ */
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('map');
const colors = { ext:'var(--wine)', int:'var(--vine)', vpn:'var(--sky)', mq:'var(--amber)', mon:'var(--muted)', log:'var(--log)', ui:'var(--sky)', proxy:'var(--vine)' };
const el = (tag, attrs={}, parent=svg) => {
  const e = document.createElementNS(NS, tag);
  for (const [k,v] of Object.entries(attrs)) e.setAttribute(k, v);
  parent.appendChild(e); return e;
};
const byId = Object.fromEntries([...CONFIG.nodes, ...CONFIG.groups].map(n => [n.id, n]));
const center = n => ({ cx: n.x + n.w/2, cy: n.y + n.h/2 });

// anchor on the rectangle border facing the other node
function anchor(n, other){
  const a = center(n), b = center(other);
  const dx = b.cx - a.cx, dy = b.cy - a.cy;
  if (Math.abs(dx) * n.h > Math.abs(dy) * n.w) {
    return { x: a.cx + Math.sign(dx) * n.w/2, y: a.cy };
  }
  return { x: a.cx, y: a.cy + Math.sign(dy) * n.h/2 };
}

// groups
for (const g of CONFIG.groups) {
  const grp = el('g');
  el('rect', { x:g.x, y:g.y, width:g.w, height:g.h, rx:16,
    fill:'var(--panel-2)', 'fill-opacity':.35, stroke:'var(--line)',
    'stroke-dasharray':'2 5' }, grp);
  const t = el('text', { x:g.x+18, y:g.y+30, class:`grp-label${g.small ? ' sm' : ''}` }, grp);
  t.textContent = g.label;
  if (g.sub) {
    const s = el('text', { x:g.x+18, y:g.y+48, class:'sub' }, grp);
    s.textContent = g.sub;
  }
  if (g.status) {
    el('circle', { cx:g.x+g.w-18, cy:g.y+24, r:5, class:'status',
      fill: (g.status === 'empty' || g.status === 'planned') ? 'var(--amber)' : 'var(--vine)' }, grp);
  }
  if ((g.domains && g.domains.length) || g.ip || g.health) {
    const b = el('text', { x:g.x+18, y:g.y+g.h-12, class:'domband' }, grp);
    const n = g.domains ? g.domains.length : 0;
    b.textContent = n ? `⌄ ${n} domain${n > 1 ? 's' : ''}` : '⌄ server info';
    b.addEventListener('click', ev => showDomains(ev, g.label, g.domains || [], g.ip, g.health));
  }
}

// edges (drawn under nodes)
const edgeLayer = el('g');
CONFIG.edges.forEach((e, i) => {
  const a = byId[e.from], b = byId[e.to];
  if (!a || !b) { console.warn('edge skipped, unknown node:', e); return; }
  const p1 = anchor(a, b), p2 = anchor(b, a);
  const mx = (p1.x + p2.x)/2, my = (p1.y + p2.y)/2;
  // gentle curve: bend via midpoint offset perpendicular-ish
  const d = `M ${p1.x} ${p1.y} Q ${mx} ${p1.y === p2.y ? my - 30 : my} ${p2.x} ${p2.y}`;
  const isPub = e.kind === 'ext' && e.from === 'internet';
  const quiet = e.kind === 'mon' || e.kind === 'log' || e.kind === 'proxy' || isPub;
  const g = el('g', { class:`edge ${e.kind}${isPub ? ' pub' : ''}`,
    'data-from':e.from, 'data-to':e.to }, edgeLayer);
  const path = el('path', { id:`e${i}`, d, stroke:colors[e.kind] }, g);
  if (!quiet) {
    // travelling particle
    const dot = el('circle', { r:3.2, fill:colors[e.kind], class:'particle' }, g);
    const mo = el('animateMotion', { dur:`${2.2 + (i % 4) * 0.5}s`,
      repeatCount:'indefinite', begin:`${(i * 0.37).toFixed(2)}s` }, dot);
    el('mpath', { href:`#e${i}` }, mo);
  }
  if (e.label && !quiet) {
    const t = el('text', { x:mx, y:my - 8, 'text-anchor':'middle' }, g);
    t.textContent = e.label;
  }
});

// nodes
for (const n of CONFIG.nodes) {
  const g = el('g', { class:`node${n.status === 'planned' ? ' planned' : ''}`, 'data-id':n.id });
  const ext = n.status === 'ext';
  const r = el('rect', { x:n.x, y:n.y, width:n.w, height:n.h, rx:10 }, g);
  if (ext) { r.setAttribute('fill','var(--bg)'); r.setAttribute('stroke','var(--wine)'); }
  const title = el('text', { x:n.x+14, y:n.y+26, class:'title' }, g);
  title.textContent = n.label + ((n.domains && n.domains.length) || n.ip || n.health ? '  ⌄' : '');
  if ((n.domains && n.domains.length) || n.ip || n.health) {
    g.setAttribute('class', g.getAttribute('class') + ' hasdom');
    g.addEventListener('click', ev => showDomains(ev, n.label, n.domains || [], n.ip, n.health));
  }
  if (n.sub) {
    const sub = el('text', { x:n.x+14, y:n.y+44, class:'sub' }, g);
    sub.textContent = n.sub;
  }
  if (!ext) {
    el('circle', { cx:n.x+n.w-16, cy:n.y+16, r:5, class:'status', 'data-node':n.id,
      fill: (n.status === 'empty' || n.status === 'planned') ? 'var(--amber)' : 'var(--vine)' }, g);
  }
  // hover isolation
  g.addEventListener('mouseenter', () => focusNode(n.id));
  g.addEventListener('mouseleave', clearFocus);
}

function focusNode(id){
  const linked = new Set([id]);
  document.querySelectorAll('.edge').forEach(e => {
    const hit = e.dataset.from === id || e.dataset.to === id;
    e.classList.toggle('dim', !hit);
    e.classList.toggle('hot', hit);
    if (hit) { linked.add(e.dataset.from); linked.add(e.dataset.to); }
  });
  document.querySelectorAll('.node').forEach(n =>
    n.classList.toggle('dim', !linked.has(n.dataset.id)));
}
function clearFocus(){
  document.querySelectorAll('.dim, .hot').forEach(x => x.classList.remove('dim','hot'));
}

/* ---------------- collapsible domain popover ---------------- */
const pop = document.getElementById('pop');
function showDomains(evt, title, domains, ip, health){
  evt.stopPropagation();
  pop.innerHTML = `<h4>${title}</h4>` +
    (ip ? `<div style="color:var(--muted);padding:2px 0">${ip}</div>` : '') +
    domains.map(d => {
    const planned = d.endsWith(' (planned)');
    const host = d.replace(' (planned)', '');
    return planned
      ? `<a style="color:var(--amber);pointer-events:none">${host} · planned</a>`
      : `<a href="https://${host}" target="_blank" rel="noopener">${host}</a>`;
  }).join('');
  pop.style.display = 'block';
  let x = evt.clientX + 10, y = evt.clientY + 10;
  const r = pop.getBoundingClientRect();
  if (x + r.width  > innerWidth  - 8) x = innerWidth  - r.width  - 8;
  if (y + r.height > innerHeight - 8) y = innerHeight - r.height - 8;
  pop.style.left = x + 'px';
  pop.style.top  = y + 'px';
}
document.addEventListener('click', () => { pop.style.display = 'none'; });
pop.addEventListener('click', e => e.stopPropagation());

const stampEl = document.getElementById('stamp');
stampEl.textContent = 'snapshot · ' + new Date().toISOString().slice(0,10);

// theme toggle: cycles auto -> dark -> light, remembers within the session
(function(){
  const root = document.documentElement;
  const btn = document.getElementById('themeToggle');
  if (!btn) return;
  function apply(mode){
    if (mode === 'dark' || mode === 'light') root.setAttribute('data-theme', mode);
    else root.removeAttribute('data-theme');
  }
  let mode = 'auto';
  btn.addEventListener('click', () => {
    mode = mode === 'auto' ? 'dark' : mode === 'dark' ? 'light' : 'auto';
    apply(mode);
    btn.textContent = mode === 'auto' ? '◐ theme' : mode === 'dark' ? '● dark' : '○ light';
  });
})();

/* ---------------- live status (healthchecks.io) ---------------- */
const STATE_COLOR = {
  up:'var(--vine)', late:'var(--amber)', grace:'var(--amber)',
  down:'var(--down)', paused:'var(--muted)', new:'var(--muted)',
};
function setStatus(id, state){
  const dot = document.querySelector(`.status[data-node="${id}"]`);
  if (dot && STATE_COLOR[state]) dot.setAttribute('fill', STATE_COLOR[state]);
}
function applyChecks(checks){
  const lookup = {};
  for (const c of checks) {
    if (c.slug) lookup[c.slug] = c.status;
    if (c.name) lookup[c.name] = c.status;
    if (c.uuid) lookup[c.uuid] = c.status;
    (c.tags || '').split(/\s+/).forEach(t => t && (lookup[t] = c.status));
  }
  for (const n of CONFIG.nodes) {
    // tri-state: a node with { liveness, freshness } combines both checks.
    // liveness down -> red; else freshness late/grace -> amber (stale); else green.
    if (n.health && typeof n.health === 'object' && n.health.liveness) {
      const live  = (lookup[n.health.liveness]  || '').toLowerCase();
      const fresh = (lookup[n.health.freshness] || '').toLowerCase();
      if (!live && !fresh) continue;
      let state = 'up';
      if (live === 'down' || live === 'paused') state = 'down';
      else if (fresh === 'late' || fresh === 'grace' || fresh === 'down') state = 'late';
      setStatus(n.id, state);
      continue;
    }
    const s = lookup[n.check || n.id];
    if (s) setStatus(n.id, s.toLowerCase());
  }
}
async function pollHealth(){
  const h = CONFIG.health;
  try {
    if (h.mode === 'badges') {
      await Promise.all(Object.entries(h.badges).map(async ([id, url]) => {
        const j = await (await fetch(url, { cache:'no-store' })).json();
        setStatus(id, (j.status || '').toLowerCase());
      }));
    } else if (h.mode === 'api') {
      if (!h.api.readOnlyKey) return;
      const r = await fetch(`${h.api.baseUrl}/api/v3/checks/`,
        { headers: { 'X-Api-Key': h.api.readOnlyKey } });
      applyChecks((await r.json()).checks || []);
    } else if (h.mode === 'file') {
      const r = await fetch(h.fileUrl, { cache:'no-store' });
      applyChecks((await r.json()).checks || []);
    }
    stampEl.textContent = 'live · synced ' +
      new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  } catch (err) {
    console.warn('health poll failed (CORS blocked? bad URL?):', err);
    stampEl.textContent = 'snapshot · live sync unavailable';
  }
}
if (CONFIG.health && CONFIG.health.mode !== 'off') {
  pollHealth();
  setInterval(pollHealth, (CONFIG.health.pollSeconds || 60) * 1000);
}
