<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-label="Trabalhar fora, sem ilusão — pisos salariais para visto qualificado em 2026">
  <defs>
    <style>
      .bg    { fill: #f5f0e8; }
      .rule  { stroke: #d9d0c2; stroke-width: 1; }
      .axis  { stroke: #c9bfae; stroke-width: 1; }
      .kicker{ font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 2.4px; fill: #b85c00; }
      .meta  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 1.4px; fill: #8a8078; }
      .title { font-family: 'Playfair Display', Georgia, serif; font-size: 52px; font-weight: 700; fill: #1a1714; }
      .titleAlt { font-family: 'Playfair Display', Georgia, serif; font-size: 52px; font-weight: 400; font-style: italic; fill: #2d6a4f; }
      .sub   { font-family: 'Source Serif 4', Georgia, serif; font-size: 16px; fill: #5a534a; }
      .caption { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 1.3px; fill: #8a8078; }
      .barval{ font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: #5a534a; }
      .barlbl{ font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 1.2px; fill: #1a1714; }
      .legend{ font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 8.5px; letter-spacing: 0.8px; fill: #8a8078; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="680" height="400"/>
  <rect x="0" y="0" width="7" height="400" fill="#2d6a4f"/>
  <rect x="7" y="0" width="3" height="400" fill="#b85c00"/>

  <text class="kicker" x="46" y="52">CARREIRA · INTERNACIONAL</text>
  <text class="meta" x="634" y="52" text-anchor="end">guilherme.stracini.com.br</text>
  <line class="rule" x1="46" y1="66" x2="634" y2="66"/>

  <text class="title" x="46" y="132">Trabalhar fora,</text>
  <text class="titleAlt" x="46" y="188">sem ilusão</text>

  <text class="sub" x="46" y="224">Os números reais de 2026 — vistos, salários,</text>
  <text class="sub" x="46" y="246">impostos e o que ninguém coloca no post do LinkedIn.</text>

  <line class="rule" x1="46" y1="278" x2="634" y2="278"/>

  <text class="caption" x="46" y="299">PISO SALARIAL PARA VISTO QUALIFICADO — € BRUTOS / ANO</text>

  <!-- bars: baseline y=378 -->
  <rect x="46"  y="342.4" width="34" height="35.6" fill="#2d6a4f"/>
  <rect x="112" y="338.1" width="34" height="39.9" fill="#2d6a4f" opacity="0.80"/>
  <rect x="178" y="339.6" width="34" height="38.4" fill="#2d6a4f" opacity="0.62"/>
  <rect x="244" y="316.0" width="34" height="62.0" fill="#b85c00"/>

  <text class="barval" x="63"  y="336" text-anchor="middle">40.904</text>
  <text class="barval" x="129" y="332" text-anchor="middle">45.934</text>
  <text class="barval" x="195" y="334" text-anchor="middle">44.160</text>
  <text class="barval" x="261" y="310" text-anchor="middle">71.304</text>

  <line class="axis" x1="46" y1="378.5" x2="278" y2="378.5"/>

  <text class="barlbl" x="63"  y="392" text-anchor="middle">IE</text>
  <text class="barlbl" x="129" y="392" text-anchor="middle">DE</text>
  <text class="barlbl" x="195" y="392" text-anchor="middle">PT</text>
  <text class="barlbl" x="261" y="392" text-anchor="middle">NL</text>

  <text class="legend" x="634" y="326" text-anchor="end">IE · IRLANDA — CRITICAL SKILLS</text>
  <text class="legend" x="634" y="342" text-anchor="end">DE · ALEMANHA — BLUE CARD (TI)</text>
  <text class="legend" x="634" y="358" text-anchor="end">PT · PORTUGAL — D8, ANUALIZADO</text>
  <text class="legend" x="634" y="374" text-anchor="end">NL · HOLANDA — HIGHLY SKILLED</text>
</svg>
