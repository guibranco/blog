<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" width="860" height="560" role="img" aria-label="Ilustração: dois desenvolvedores experientes colocam a mão no ombro de um iniciante sentado ao notebook, com a mensagem de que ninguém vai abrir o e-commerce falso do portfólio" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="860" height="560" fill="#f5f0e8"/>
  <rect x="16" y="16" width="828" height="528" fill="none" stroke="#e2dbd0" stroke-width="1"/>

  <text x="48" y="60" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2.2" fill="#b85c00">A CONVERSA QUE NINGUÉM TEVE COM VOCÊ</text>
  <text x="48" y="102" font-family="Playfair Display, Georgia, serif" font-size="27" fill="#1a1714">Ninguém vai abrir o seu e-commerce fake</text>
  <text x="48" y="130" font-family="Source Serif 4, Georgia, serif" font-size="15" fill="#5a534a">Não é maldade. É que não há nada ali que possa ser avaliado.</text>
  <line x1="48" y1="152" x2="812" y2="152" stroke="#e2dbd0" stroke-width="1"/>

  <!-- ground line -->
  <line x1="120" y1="452" x2="740" y2="452" stroke="#e2dbd0" stroke-width="1"/>

  <!-- ===== elder, left ===== -->
  <path d="M292 452 L296 268 a34 34 0 0 1 68 0 L368 452 Z" fill="#e8f5ee" stroke="#2d6a4f" stroke-width="1.6" stroke-linejoin="round"/>
  <circle cx="330" cy="232" r="30" fill="#faf9f6" stroke="#2d6a4f" stroke-width="1.6"/>
  <path d="M306 240 C306 302, 354 302, 354 240 C346 262, 314 262, 306 240 Z" fill="#e8f5ee" stroke="#2d6a4f" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M303 222 q10 -22 27 -22 q17 0 27 22" fill="none" stroke="#2d6a4f" stroke-width="1.6"/>
  <circle cx="320" cy="230" r="2.6" fill="#2d6a4f"/>
  <circle cx="341" cy="230" r="2.6" fill="#2d6a4f"/>
  <!-- ===== elder, right ===== -->
  <path d="M568 452 L572 268 a34 34 0 0 1 68 0 L644 452 Z" fill="#e8f5ee" stroke="#2d6a4f" stroke-width="1.6" stroke-linejoin="round"/>
  <circle cx="606" cy="232" r="30" fill="#faf9f6" stroke="#2d6a4f" stroke-width="1.6"/>
  <path d="M582 240 C582 302, 630 302, 630 240 C622 262, 590 262, 582 240 Z" fill="#e8f5ee" stroke="#2d6a4f" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M579 222 q10 -22 27 -22 q17 0 27 22" fill="none" stroke="#2d6a4f" stroke-width="1.6"/>
  <circle cx="595" cy="230" r="2.6" fill="#2d6a4f"/>
  <circle cx="616" cy="230" r="2.6" fill="#2d6a4f"/>
  <!-- ===== beginner, centre ===== -->
  <path d="M400 452 L404 348 a64 46 0 0 1 128 0 L536 452 Z" fill="#faf9f6" stroke="#1a1714" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="468" cy="292" r="32" fill="#faf9f6" stroke="#1a1714" stroke-width="1.8"/>
  <circle cx="457" cy="290" r="2.8" fill="#1a1714"/>
  <circle cx="479" cy="290" r="2.8" fill="#1a1714"/>
  <path d="M458 306 q10 7 20 0" fill="none" stroke="#1a1714" stroke-width="1.8" stroke-linecap="round"/>

  <!-- hands resting on the beginner's shoulders (drawn on top) -->
  <path d="M362 284 q44 10 58 48" fill="none" stroke="#2d6a4f" stroke-width="7" stroke-linecap="round"/>
  <path d="M420 336 a11 11 0 0 0 20 6" fill="none" stroke="#2d6a4f" stroke-width="5" stroke-linecap="round"/>
  <path d="M574 284 q-44 10 -58 48" fill="none" stroke="#2d6a4f" stroke-width="7" stroke-linecap="round"/>
  <path d="M516 336 a11 11 0 0 1 -20 6" fill="none" stroke="#2d6a4f" stroke-width="5" stroke-linecap="round"/>

  <!-- desk + laptop -->
  <rect x="376" y="404" width="184" height="8" rx="3" fill="#f2ede6" stroke="#e2dbd0" stroke-width="1"/>
  <path d="M424 404 L436 366 H500 L512 404 Z" fill="#f2ede6" stroke="#1a1714" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="468" y="392" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#8a8078">loja-fake</text>

  <!-- captions -->
  <text x="430" y="500" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="16" font-style="italic" fill="#5a534a">“Está bonito. Só que ninguém vai clicar — nem eu, nem o recrutador,</text>
  <text x="430" y="524" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="16" font-style="italic" fill="#5a534a">nem o time que vai te entrevistar na semana que vem.”</text>
</svg>
