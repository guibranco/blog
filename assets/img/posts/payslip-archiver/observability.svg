<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" role="img" aria-labelledby="t d">
  <title id="t">payslip-archiver: configuration, secrets and monitoring</title>
  <desc id="d">At startup the worker reads configuration and secrets from Grimoire. During each cycle it pings Healthchecks.io, writes to journald, and ships batched logs to LogStream. Only three Grimoire bootstrap keys live on the host.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#93c97a"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#e0b84f"/>
    </marker>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#b85c00"/>
    </marker>
  </defs>
  <rect width="860" height="380" fill="#0f0e0c"/>

  <!-- VM boundary -->
  <rect x="250" y="40" width="360" height="300" rx="10" fill="none" stroke="#3a352d" stroke-dasharray="6 5"/>
  <text x="264" y="62" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8a8078">OCI VM · systemd · user=payslip</text>

  <g font-family="'JetBrains Mono', monospace" text-anchor="middle">
    <!-- env -->
    <g transform="translate(280,84)">
      <rect width="300" height="54" rx="6" fill="#1e1c18" stroke="#5a534a"/>
      <text x="150" y="22" font-size="11" fill="#c9bfb2">/etc/payslip-archiver/env  (600)</text>
      <text x="150" y="40" font-size="10" fill="#8a8078">Grimoire__BaseUrl · ApiKey · Environment</text>
    </g>
    <!-- worker -->
    <g transform="translate(310,170)">
      <rect width="240" height="76" rx="8" fill="#1e1c18" stroke="#93c97a" stroke-width="2"/>
      <text x="120" y="32" font-size="14" fill="#f5f0e8">payslip-archiver</text>
      <text x="120" y="54" font-size="10" fill="#8a8078">.NET 10 worker · Type=notify</text>
    </g>
    <!-- journald -->
    <g transform="translate(350,282)">
      <rect width="160" height="40" rx="6" fill="#1e1c18" stroke="#5a534a"/>
      <text x="80" y="25" font-size="11" fill="#c9bfb2">journald</text>
    </g>

    <!-- Grimoire -->
    <g transform="translate(24,120)">
      <rect width="190" height="96" rx="8" fill="#1e1c18" stroke="#e0b84f"/>
      <text x="95" y="30" font-size="14" fill="#e0b84f">Grimoire</text>
      <text x="95" y="52" font-size="10" fill="#8a8078">configurations (all)</text>
      <text x="95" y="68" font-size="10" fill="#8a8078">secrets by name</text>
      <text x="95" y="84" font-size="10" fill="#8a8078">Pdf--Password → Pdf:Password</text>
    </g>

    <!-- LogStream -->
    <g transform="translate(646,92)">
      <rect width="190" height="84" rx="8" fill="#1e1c18" stroke="#93c97a"/>
      <text x="95" y="30" font-size="14" fill="#93c97a">LogStream</text>
      <text x="95" y="52" font-size="10" fill="#8a8078">batches ≤100 / 2 s</text>
      <text x="95" y="68" font-size="10" fill="#8a8078">queue 10k · retry 5 min</text>
    </g>

    <!-- Healthchecks -->
    <g transform="translate(646,226)">
      <rect width="190" height="84" rx="8" fill="#1e1c18" stroke="#b85c00"/>
      <text x="95" y="30" font-size="14" fill="#f0a35e">Healthchecks.io</text>
      <text x="95" y="52" font-size="10" fill="#8a8078">/start · ok · /fail</text>
      <text x="95" y="68" font-size="10" fill="#8a8078">alerts on silence</text>
    </g>
  </g>

  <!-- arrows -->
  <g fill="none" stroke-width="2">
    <line x1="430" y1="138" x2="430" y2="168" stroke="#5a534a" marker-end="url(#a)"/>
    <path d="M214 168 H308" stroke="#e0b84f" marker-end="url(#o)"/>
    <path d="M550 192 C600 192 600 134 644 134" stroke="#93c97a" marker-end="url(#a)"/>
    <path d="M550 226 C600 226 600 268 644 268" stroke="#b85c00" marker-end="url(#h)"/>
    <line x1="430" y1="246" x2="430" y2="280" stroke="#5a534a" marker-end="url(#a)"/>
  </g>
  <g font-family="'JetBrains Mono', monospace" font-size="10">
    <text x="222" y="160" fill="#e0b84f">startup · fail fast</text>
    <text x="616" y="200" fill="#93c97a">logs</text>
    <text x="616" y="236" fill="#f0a35e">every cycle</text>
  </g>
</svg>
