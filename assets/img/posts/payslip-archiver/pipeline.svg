<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" width="860" height="340" role="img" aria-labelledby="t d">
  <title id="t">payslip-archiver: one archive cycle</title>
  <desc id="d">Mailbox to filter to decrypt to SHA-256 duplicate check to store, then the SQLite ledger is written before the e-mail is marked as handled. Non-matching messages go straight to the ledger as ignored.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#93c97a"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a534a"/>
    </marker>
  </defs>
  <rect width="860" height="340" fill="#0f0e0c"/>
  <text x="24" y="32" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8a8078">// one cycle — every Schedule:Interval (6 h in production)</text>

  <g font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">
    <!-- mailbox -->
    <g transform="translate(24,70)">
      <rect width="120" height="64" rx="8" fill="#1e1c18" stroke="#c9bfb2"/>
      <text x="60" y="28" fill="#f5f0e8">Payroll</text>
      <text x="60" y="46" fill="#f5f0e8">mailbox</text>
    </g>
    <text x="84" y="152" font-size="10" fill="#8a8078">IMAP / POP3 · MailKit</text>

    <!-- filter -->
    <g transform="translate(184,70)">
      <rect width="130" height="64" rx="8" fill="#1e1c18" stroke="#93c97a"/>
      <text x="65" y="28" fill="#93c97a">filter</text>
      <text x="65" y="46" font-size="10" fill="#8a8078">sender·subject·*.pdf</text>
    </g>

    <!-- decrypt -->
    <g transform="translate(354,70)">
      <rect width="130" height="64" rx="8" fill="#1e1c18" stroke="#e0b84f"/>
      <text x="65" y="28" fill="#e0b84f">decrypt</text>
      <text x="65" y="46" font-size="10" fill="#8a8078">PDFsharp | qpdf</text>
    </g>

    <!-- hash -->
    <g transform="translate(524,70)">
      <rect width="130" height="64" rx="8" fill="#1e1c18" stroke="#93c97a"/>
      <text x="65" y="28" fill="#93c97a">SHA-256</text>
      <text x="65" y="46" font-size="10" fill="#8a8078">duplicate check</text>
    </g>

    <!-- store -->
    <g transform="translate(694,70)">
      <rect width="142" height="64" rx="8" fill="#1e1c18" stroke="#b85c00"/>
      <text x="71" y="28" fill="#f0a35e">store</text>
      <text x="71" y="46" font-size="10" fill="#8a8078">Dropbox | folder</text>
    </g>

    <!-- ledger -->
    <g transform="translate(560,214)">
      <rect width="150" height="64" rx="8" fill="#1e1c18" stroke="#93c97a" stroke-width="2"/>
      <text x="75" y="28" fill="#93c97a">ledger</text>
      <text x="75" y="46" font-size="10" fill="#8a8078">SQLite · source of truth</text>
    </g>

    <!-- mark handled -->
    <g transform="translate(250,214)">
      <rect width="200" height="64" rx="8" fill="#1e1c18" stroke="#c9bfb2"/>
      <text x="100" y="28" fill="#f5f0e8">mark handled</text>
      <text x="100" y="46" font-size="10" fill="#8a8078">\Seen + move to Processed</text>
    </g>
  </g>

  <!-- arrows -->
  <g stroke="#93c97a" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="144" y1="102" x2="182" y2="102"/>
    <line x1="314" y1="102" x2="352" y2="102"/>
    <line x1="484" y1="102" x2="522" y2="102"/>
    <line x1="654" y1="102" x2="692" y2="102"/>
    <path d="M765 134 V246 H712"/>
    <line x1="560" y1="246" x2="452" y2="246"/>
  </g>
  <!-- no match -->
  <path d="M249 134 V180 H600 V212" stroke="#5a534a" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#g)"/>
  <text x="258" y="174" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8a8078">no match → recorded as ignored</text>

  <g font-family="'JetBrains Mono', monospace" font-size="10.5">
    <text x="726" y="198" fill="#e0b84f">① record outcome</text>
    <text x="470" y="236" fill="#e0b84f">② then flag</text>
  </g>

  <text x="24" y="316" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c9bfb2">flag fails after the ledger write → next cycle only re-flags · bad message → retried ≤ 5×, then left alone</text>
</svg>
