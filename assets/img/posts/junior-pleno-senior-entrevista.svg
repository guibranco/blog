    <text x="110" y="492">JR — escreve</text>
    <rect x="350" y="474" width="22" height="22" fill="#b85c00"/>
    <text x="384" y="492">PL — pergunta</text>
    <rect x="640" y="474" width="22" height="22" fill="#2d6a4f"/>
    <text x="674" y="492">SR — antecipa</text>
  </g>

  <g>
