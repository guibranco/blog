<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="1200" height="706" role="img" aria-label="Repositório não é arquitetura">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93c97a" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#93c97a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="680" height="400" fill="#0f0e0c"/>
  <rect width="680" height="400" fill="url(#grid)"/>
  <circle cx="612" cy="72" r="150" fill="url(#glow)"/>

  <!-- top rule + kicker -->
  <rect x="50" y="52" width="26" height="2" fill="#b85c00"/>
  <text x="86" y="57" font-family="JetBrains Mono, monospace" font-size="10.5" letter-spacing="1.6" fill="#b85c00">CODING · ARQUITETURA</text>

  <!-- title -->
  <text x="50" y="118" font-family="Playfair Display, serif" font-weight="700" font-size="42" fill="#f5f0e8">Repositório</text>
  <text x="50" y="164" font-family="Playfair Display, serif" font-weight="700" font-size="42" fill="#f5f0e8">não é</text>
  <text x="50" y="210" font-family="Playfair Display, serif" font-weight="700" font-size="42" fill="#93c97a">arquitetura</text>

  <rect x="50" y="236" width="54" height="3" fill="#b85c00"/>

  <!-- subtitle -->
  <text x="50" y="270" font-family="Source Serif 4, serif" font-size="15" fill="#a29a90">Separar frontend e backend não transforma</text>
  <text x="50" y="292" font-family="Source Serif 4, serif" font-size="15" fill="#a29a90">o seu monólito em microserviços.</text>

  <!-- bottom mono tags -->
  <text x="50" y="348" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="1.1" fill="#5a534a">monorepo · polirepo · deploy · bounded context</text>

  <!-- right diagram -->
  <g>
    <rect x="404" y="96" width="112" height="42" rx="6" fill="#1a1814" stroke="#2f2a24" stroke-width="1.2"/>
    <text x="460" y="122" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#e8e2d8">web-app/</text>

    <rect x="528" y="96" width="98" height="42" rx="6" fill="#1a1814" stroke="#2f2a24" stroke-width="1.2"/>
    <text x="577" y="122" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#e8e2d8">api/</text>

    <text x="515" y="180" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#5a534a">2 repositórios · 2 camadas</text>

    <g stroke="#b85c00" stroke-width="3.2" stroke-linecap="round">
      <line x1="496" y1="208" x2="534" y2="208"/>
      <line x1="496" y1="222" x2="534" y2="222"/>
      <line x1="530" y1="198" x2="500" y2="232"/>
    </g>

    <rect x="404" y="256" width="222" height="46" rx="6" fill="none" stroke="#93c97a" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="515" y="284" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#93c97a">microservices</text>

    <text x="515" y="326" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#5a534a">deploy independente · dados próprios</text>
  </g>
</svg>
