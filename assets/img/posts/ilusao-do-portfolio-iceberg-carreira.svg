<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1080" width="860" height="1080" role="img" aria-label="Iceberg da carreira em software: escrever código acima da linha d'água, todo o resto abaixo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="860" height="1080" fill="#f5f0e8"/>
  <rect x="16" y="16" width="828" height="1048" fill="none" stroke="#e2dbd0" stroke-width="1"/>

  <text x="48" y="62" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2.2" fill="#b85c00">O ICEBERG DA CARREIRA</text>
  <text x="48" y="102" font-family="Playfair Display, Georgia, serif" font-size="28" fill="#1a1714">Escrever código é a ponta</text>
  <text x="48" y="132" font-family="Source Serif 4, Georgia, serif" font-size="15" fill="#5a534a">O que um portfólio de curso mostra × o que a vaga precisa avaliar</text>

  <!-- water -->
  <rect x="17" y="330" width="826" height="733" fill="#e8f5ee"/>
  <line x1="17" y1="330" x2="843" y2="330" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="60" y="322" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="1.6" fill="#2d6a4f">LINHA D'ÁGUA</text>

  <!-- tip above water -->
  <polygon points="430,182 545,330 315,330" fill="#faf9f6" stroke="#2d6a4f" stroke-width="1.4"/>
  <text x="430" y="286" text-anchor="middle" font-family="Playfair Display, Georgia, serif" font-size="20" fill="#1a1714">Escrever código</text>
  <text x="430" y="310" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#5a534a">sintaxe · framework · CRUD</text>

  <line x1="560" y1="240" x2="640" y2="212" stroke="#b85c00" stroke-width="1"/>
  <text x="648" y="208" font-family="Source Serif 4, Georgia, serif" font-size="13.5" fill="#b85c00">o que cabe</text>
  <text x="648" y="226" font-family="Source Serif 4, Georgia, serif" font-size="13.5" fill="#b85c00">num curso</text>
  <text x="648" y="244" font-family="Source Serif 4, Georgia, serif" font-size="13.5" fill="#b85c00">de 30 reais</text>

  <!-- submerged mass -->
  <polygon points="315,330 545,330 700,420 762,640 700,860 560,970 430,1012 270,950 140,830 108,640 168,450"
           fill="#faf9f6" stroke="#2d6a4f" stroke-width="1.4" opacity="0.97"/>

  <text x="430" y="378" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" letter-spacing="1.6" fill="#5a534a">O QUE NINGUÉM AVALIA NO SEU CLONE</text>

  <!-- column 1 -->
  <rect x="238" y="418" width="7" height="7" fill="#2d6a4f"/>
  <text x="257" y="426" font-family="Source Serif 4, Georgia, serif" font-size="15" fill="#1a1714">Requisito ambíguo</text>
  <rect x="200" y="468" width="7" height="7" fill="#2d6a4f"/>
  <text x="219" y="476" font-family="Source Serif 4, Georgia, serif" font-size="15" fill="#1a1714">Código legado alheio</text>
  <rect x="200" y="518" width="7" height="7" fill="#2d6a4f"/>
  <text x="219" y="526" font-family="Source Serif 4, Georgia, serif" font-size="15" fill="#1a1714">Code review de verdade</text>
  <rect x="200" y="568" width="7" height="7" fill="#2d6a4f"/>
  <text x="219" y="576" font-family="Source Serif 4, Georgia, serif" font-size="15" fill="#1a1714">Teste automatizado</text>
  <rect x="200" y="618" width="7" height="7" fill="#2d6a4f"/>
  <text x="219" y="626" font-family="Source Serif 4, Georgia, serif" font-size="15" fill="#1a1714">CI/CD e rollback</text>
  <rect x="200" y="668" width="7" height="7" fill="#2d6a4f"/>
  <text x="219" y="676" font-family="Source Serif 4, Georgia, serif" font-size="15" fill="#1a1714">Log, métrica, alerta</text>
  <rect x="200" y="718" width="7" height="7" fill="#2d6a4f"/>
  <text x="219" y="726" font-family="Source Serif 4, Georgia, serif" font-size="15" fill="#1a1714">Plantão e incidente</text>
  <rect x="212" y="768" width="7" height="7" fill="#2d6a4f"/>
  <text x="231" y="776" font-family="Source Serif 4, Georgia, serif" font-size="15" fill="#1a1714">Migration em produção</text>
  <rect x="236" y="818" width="7" height="7" fill="#2d6a4f"/>
  <text x="255" y="826" font-family="Source Serif 4, Georgia, serif" font-size="15" fill="#1a1714">Dado real e sujo</text>

  <!-- column 2 -->
  <rect x="470" y="418" width="7" height="7" fill="#b85c00"/>
  <text x="489" y="426" font-family="Source Serif 4, Georgia, serif" font-size="15" fill="#1a1714">Prazo e estimativa</text>
  <rect x="470" y="468" width="7" height="7" fill="#b85c00"/>
  <text x="489" y="476" font-family="Source Serif 4, Georgia, serif" font-size="15" fill="#1a1714">Negociação de escopo</text>
  <rect x="470" y="518" width="7" height="7" fill="#b85c00"/>
  <text x="489" y="526" font-family="Source Serif 4, Georgia, serif" font-size="15" fill="#1a1714">Custo de infra</text>
  <rect x="470" y="568" width="7" height="7" fill="#b85c00"/>
  <text x="489" y="576" font-family="Source Serif 4, Georgia, serif" font-size="15" fill="#1a1714">Segurança e LGPD</text>
  <rect x="470" y="618" width="7" height="7" fill="#b85c00"/>
  <text x="489" y="626" font-family="Source Serif 4, Georgia, serif" font-size="15" fill="#1a1714">Dívida técnica</text>
  <rect x="470" y="668" width="7" height="7" fill="#b85c00"/>
  <text x="489" y="676" font-family="Source Serif 4, Georgia, serif" font-size="15" fill="#1a1714">Documentar decisão</text>
  <rect x="470" y="718" width="7" height="7" fill="#b85c00"/>
  <text x="489" y="726" font-family="Source Serif 4, Georgia, serif" font-size="15" fill="#1a1714">Comunicação escrita</text>
  <rect x="458" y="768" width="7" height="7" fill="#b85c00"/>
  <text x="477" y="776" font-family="Source Serif 4, Georgia, serif" font-size="15" fill="#1a1714">Trabalhar com gente</text>
  <rect x="434" y="818" width="7" height="7" fill="#b85c00"/>
  <text x="453" y="826" font-family="Source Serif 4, Georgia, serif" font-size="15" fill="#1a1714">Manter o que subiu</text>

  <line x1="300" y1="868" x2="560" y2="868" stroke="#e2dbd0" stroke-width="1"/>
  <text x="430" y="900" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="14" font-style="italic" fill="#5a534a">Nada disso se aprende sem consequência real —</text>
  <text x="430" y="922" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="14" font-style="italic" fill="#5a534a">por isso não cabe em bootcamp nem em vídeo-aula.</text>

  <text x="48" y="1046" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="1.4" fill="#8a8078">guilherme.stracini.com.br/blog</text>
</svg>
