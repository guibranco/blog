<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-label="Comparação entre o multiplicador de custo do empregador e o multiplicador de equivalência do trabalhador PJ em 2026">
  <rect width="680" height="400" fill="#f5f0e8"/>

  <text x="40" y="30" font-family="Playfair Display, Georgia, serif" font-size="19" font-weight="700" fill="#1a1714">Dois multiplicadores diferentes — e a negociação mora no meio</text>
  <text x="40" y="48" font-family="Source Serif 4, Georgia, serif" font-size="12.5" fill="#5a534a">Quanto o CLT custa à empresa × quanto o PJ precisa faturar para empatar (números de 2026)</text>

  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5">
    <rect x="40" y="60" width="11" height="11" fill="#2d6a4f"/>
    <text x="57" y="70" fill="#5a534a">Custo do CLT p/ a empresa</text>
    <rect x="228" y="60" width="11" height="11" fill="#b85c00"/>
    <text x="245" y="70" fill="#5a534a">PJ equivalente (12 meses)</text>
    <rect x="410" y="60" width="11" height="11" fill="#c9a227"/>
    <text x="427" y="70" fill="#5a534a">PJ com 1 mês de férias real</text>
  </g>

  <g stroke="#e2dbd0" stroke-width="1">
    <line x1="80" y1="96" x2="640" y2="96"/>
    <line x1="80" y1="148.5" x2="640" y2="148.5"/>
    <line x1="80" y1="201" x2="640" y2="201"/>
    <line x1="80" y1="253.5" x2="640" y2="253.5"/>
  </g>
  <line x1="80" y1="306" x2="640" y2="306" stroke="#8a8078" stroke-width="1.5"/>

  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#8a8078" text-anchor="end">
    <text x="70" y="100">2,00×</text>
    <text x="70" y="152.5">1,75×</text>
    <text x="70" y="205">1,50×</text>
    <text x="70" y="257.5">1,25×</text>
    <text x="70" y="310">1,00×</text>
  </g>

  <g>
    <rect x="105" y="110.7" width="40" height="195.3" fill="#2d6a4f"/>
    <rect x="155" y="192.6" width="40" height="113.4" fill="#b85c00"/>
    <rect x="205" y="163.2" width="40" height="142.8" fill="#c9a227"/>
    <rect x="285" y="140.1" width="40" height="165.9" fill="#2d6a4f"/>
    <rect x="335" y="253.5" width="40" height="52.5" fill="#b85c00"/>
    <rect x="385" y="230.4" width="40" height="75.6" fill="#c9a227"/>
    <rect x="465" y="152.7" width="40" height="153.3" fill="#2d6a4f"/>
    <rect x="515" y="255.6" width="40" height="50.4" fill="#b85c00"/>
    <rect x="565" y="230.4" width="40" height="75.6" fill="#c9a227"/>
  </g>

  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#1a1714" text-anchor="middle">
    <text x="125" y="104.7">1,93</text>
    <text x="175" y="186.6">1,54</text>
    <text x="225" y="157.2">1,68</text>
    <text x="305" y="134.1">1,79</text>
    <text x="355" y="247.5">1,25</text>
    <text x="405" y="224.4">1,36</text>
    <text x="485" y="146.7">1,73</text>
    <text x="535" y="249.6">1,24</text>
    <text x="585" y="224.4">1,36</text>
  </g>

  <g font-family="Source Serif 4, Georgia, serif" font-size="13" fill="#1a1714" text-anchor="middle">
    <text x="175" y="328">CLT R$ 6.000</text>
    <text x="355" y="328">CLT R$ 12.000</text>
    <text x="535" y="328">CLT R$ 20.000</text>
  </g>

  <line x1="40" y1="348" x2="640" y2="348" stroke="#e2dbd0" stroke-width="1"/>
  <text x="40" y="366" font-family="Source Serif 4, Georgia, serif" font-size="11.5" fill="#5a534a">Premissas: encargos de 26,8% (INSS patronal + RAT + terceiros), FGTS 8%, VR R$ 1.100, plano de saúde R$ 600,</text>
  <text x="40" y="381" font-family="Source Serif 4, Georgia, serif" font-size="11.5" fill="#5a534a">PJ no Anexo III (Fator R de 28% ou mais), contador R$ 250/mês. Cálculos detalhados no corpo do artigo.</text>
</svg>
