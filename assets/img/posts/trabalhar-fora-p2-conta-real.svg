      .barval{ font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #5a534a; }
      .barlbl{ font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1.2px; fill: #1a1714; }
