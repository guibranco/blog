<text x="40" y="362" font-family="Source Serif 4, Georgia, serif" font-size="13.5" fill="#1a1714">Cobrar como se fossem 168 h embute um <tspan font-weight="700" fill="#b85c00">desconto de 23%</tspan> que ningu&#233;m pediu.</text>
<text x="40" y="382" font-family="JetBrains Mono, Menlo, monospace" font-size="9" fill="#8a8078">distribui&#231;&#227;o ilustrativa &#8212; me&#231;a as suas pr&#243;prias horas por 3 meses antes de fixar o n&#250;mero</text>
