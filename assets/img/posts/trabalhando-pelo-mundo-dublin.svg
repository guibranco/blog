  <text class="mono" x="56" y="340" font-size="11.5" letter-spacing="1.2" fill="#5a534a">OUTSURANCE</text>
  <text class="mono" x="56" y="358" font-size="11.5" letter-spacing="1.2" fill="#8a8078">Senior Software Engineer · Finance &amp; Billing</text>
  <text class="mono" x="624" y="340" font-size="11.5" letter-spacing="1.2" fill="#b85c00" text-anchor="end">DESDE ABR 2023</text>
