<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="1200" height="630" role="img" aria-label="Trabalhando pelo mundo 01 — Porto: a mudança que nunca aconteceu">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; }
      .serif { font-family: 'Playfair Display', 'Source Serif 4', Georgia, serif; }
      .sserif { font-family: 'Source Serif 4', Georgia, serif; }
    </style>
  </defs>

  <!-- background (oversized to avoid letterbox bars) -->
  <rect x="-260" y="-160" width="1200" height="720" fill="#f5f0e8"/>

  <!-- top rule -->
  <rect x="56" y="52" width="568" height="1" fill="#e2dbd0"/>

  <!-- series kicker -->
  <text class="mono" x="56" y="42" font-size="11" letter-spacing="2.4" fill="#b85c00">TRABALHANDO PELO MUNDO</text>
  <text class="mono" x="624" y="42" font-size="11" letter-spacing="2.4" fill="#8a8078" text-anchor="end">01 / 03</text>

  <!-- accent bars -->
  <rect x="56" y="82" width="46" height="5" fill="#2d6a4f"/>
  <rect x="108" y="82" width="18" height="5" fill="#b85c00"/>
  <rect x="132" y="82" width="8" height="5" fill="#e2dbd0"/>

  <!-- title -->
  <text class="serif" x="56" y="164" font-size="72" font-weight="700" fill="#1a1714">Porto</text>
  <text class="sserif" x="56" y="204" font-size="25" font-style="italic" fill="#5a534a">a mudança que nunca aconteceu</text>

  <!-- flight path: Brazil -> Portugal, dashed, never landing -->
  <g transform="translate(56,246)">
    <circle cx="4" cy="14" r="5" fill="#2d6a4f"/>
    <path d="M4 14 C 120 -18, 300 -18, 420 14" fill="none" stroke="#b85c00" stroke-width="1.6" stroke-dasharray="5 5" opacity="0.75"/>
    <circle cx="420" cy="14" r="6.5" fill="none" stroke="#b85c00" stroke-width="1.8" stroke-dasharray="3 3"/>
    <text class="mono" x="0" y="34" font-size="10.5" letter-spacing="1.4" fill="#8a8078">SÃO PAULO</text>
    <text class="mono" x="420" y="34" font-size="10.5" letter-spacing="1.4" fill="#8a8078" text-anchor="middle">PORTO</text>
  </g>

  <!-- bottom rule -->
  <rect x="56" y="316" width="568" height="1" fill="#e2dbd0"/>

  <!-- meta row -->
  <text class="mono" x="56" y="340" font-size="11.5" letter-spacing="1.2" fill="#5a534a">FARFETCH via MULTIVISION</text>
  <text class="mono" x="56" y="358" font-size="11.5" letter-spacing="1.2" fill="#8a8078">Senior Software Engineer · Scouts Team</text>
  <text class="mono" x="624" y="340" font-size="11.5" letter-spacing="1.2" fill="#b85c00" text-anchor="end">DEZ 2020 — MAI 2021</text>
  <text class="mono" x="624" y="358" font-size="11.5" letter-spacing="1.2" fill="#8a8078" text-anchor="end">6 meses · 0 km</text>
</svg>
