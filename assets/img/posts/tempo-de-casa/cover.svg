<svg viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .title { font-family: 'Playfair Display', Georgia, serif; fill: #1a1714; }
      .subtitle { font-family: 'Source Serif 4', Georgia, serif; fill: #5a534a; }
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #8a8078; }
    </style>
  </defs>

  <rect x="0" y="0" width="680" height="400" fill="#f5f0e8"/>
  <rect x="16" y="16" width="648" height="368" fill="none" stroke="#e2dbd0" stroke-width="1.5"/>

  <text x="48" y="70" class="mono" font-size="13" letter-spacing="2">CARREIRA · MERCADO DE TRABALHO</text>

  <line x1="48" y1="92" x2="140" y2="92" stroke="#b85c00" stroke-width="3"/>
  <line x1="144" y1="92" x2="180" y2="92" stroke="#2d6a4f" stroke-width="3"/>

  <text x="46" y="175" class="title" font-size="54" font-weight="600">Tempo de</text>
  <text x="46" y="235" class="title" font-size="54" font-weight="600">Casa</text>

  <text x="48" y="270" class="subtitle" font-size="19">Ficar ou pular de empresa em empresa —</text>
  <text x="48" y="296" class="subtitle" font-size="19">o que realmente pesa na carreira</text>

  <!-- "ficar" — straight steady line -->
  <line x1="48" y1="336" x2="300" y2="336" stroke="#2d6a4f" stroke-width="3" stroke-linecap="round"/>
  <circle cx="300" cy="336" r="5" fill="#2d6a4f"/>
  <text x="48" y="356" class="mono" font-size="11" fill="#2d6a4f">FICAR</text>

  <!-- "pular" — stepped zig-zag line -->
  <polyline points="360,336 400,336 400,320 440,320 440,344 480,344 480,326 520,326 520,336 560,336"
            fill="none" stroke="#b85c00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="400" cy="336" r="4" fill="#b85c00"/>
  <circle cx="440" cy="320" r="4" fill="#b85c00"/>
  <circle cx="480" cy="344" r="4" fill="#b85c00"/>
  <circle cx="520" cy="326" r="4" fill="#b85c00"/>
  <text x="360" y="356" class="mono" font-size="11" fill="#b85c00">PULAR</text>

  <text x="632" y="368" text-anchor="end" class="mono" font-size="12" fill="#8a8078">stracini.com.br</text>
</svg>
