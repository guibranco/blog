<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .title { font-family: 'Playfair Display', Georgia, serif; fill: #1a1714; }
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #5a534a; }
      .muted { font-family: 'Source Serif 4', Georgia, serif; fill: #8a8078; }
      .legend { font-family: 'Source Serif 4', Georgia, serif; fill: #1a1714; }
    </style>
  </defs>

  <rect x="0" y="0" width="800" height="460" fill="#faf9f6"/>
  <rect x="0.5" y="0.5" width="799" height="459" fill="none" stroke="#e2dbd0"/>

  <text x="32" y="44" class="title" font-size="22" font-weight="600">O "prêmio" de trocar de emprego está encolhendo</text>
  <text x="32" y="66" class="muted" font-size="13">Crescimento salarial médio (EUA): quem troca de emprego vs. quem fica — Atlanta Fed / Bank of America</text>

  <!-- axis -->
  <line x1="80" y1="100" x2="80" y2="380" stroke="#e2dbd0"/>
  <line x1="80" y1="380" x2="760" y2="380" stroke="#e2dbd0"/>
  <g class="mono" font-size="11">
    <line x1="80" y1="380" x2="760" y2="380" stroke="#e2dbd0"/>
    <line x1="80" y1="300" x2="760" y2="300" stroke="#e2dbd0" stroke-dasharray="2,4"/>
    <line x1="80" y1="220" x2="760" y2="220" stroke="#e2dbd0" stroke-dasharray="2,4"/>
    <line x1="80" y1="140" x2="760" y2="140" stroke="#e2dbd0" stroke-dasharray="2,4"/>
    <text x="70" y="384" text-anchor="end" fill="#8a8078">0%</text>
    <text x="70" y="304" text-anchor="end" fill="#8a8078">4%</text>
    <text x="70" y="224" text-anchor="end" fill="#8a8078">8%</text>
    <text x="70" y="144" text-anchor="end" fill="#8a8078">12%</text>
  </g>

  <!-- 4 groups of bars: 2022, 2023, 2025, 2026 -->
  <!-- scale: 20px per 1% -->
  <!-- 2022: switchers ~14%, stayers ~6% (approx, post-pandemic peak) -->
  <g>
    <rect x="140" y="100" width="34" height="280" fill="#b85c00"/>
    <rect x="178" y="260" width="34" height="120" fill="#2d6a4f"/>
    <text x="176" y="398" text-anchor="middle" class="legend" font-size="13">2022</text>
  </g>
  <!-- 2023: switchers 7.7%, stayers 5.5% -->
  <g>
    <rect x="320" y="226" width="34" height="154" fill="#b85c00"/>
    <rect x="358" y="270" width="34" height="110" fill="#2d6a4f"/>
    <text x="356" y="398" text-anchor="middle" class="legend" font-size="13">2023</text>
  </g>
  <!-- 2025 (jan/fev): switchers 4.8%, stayers 4.6% -->
  <g>
    <rect x="500" y="284" width="34" height="96" fill="#b85c00"/>
    <rect x="538" y="288" width="34" height="92" fill="#2d6a4f"/>
    <text x="536" y="398" text-anchor="middle" class="legend" font-size="13">2025</text>
  </g>
  <!-- 2026 (jan): switchers 4%, stayers 3.5% -->
  <g>
    <rect x="640" y="300" width="34" height="80" fill="#b85c00"/>
    <rect x="678" y="310" width="34" height="70" fill="#2d6a4f"/>
    <text x="676" y="398" text-anchor="middle" class="legend" font-size="13">2026</text>
  </g>

  <!-- value labels -->
  <g class="mono" font-size="11">
    <text x="157" y="94" text-anchor="middle" fill="#b85c00">~14%</text>
    <text x="195" y="254" text-anchor="middle" fill="#2d6a4f">~6%</text>
    <text x="337" y="220" text-anchor="middle" fill="#b85c00">7,7%</text>
    <text x="375" y="264" text-anchor="middle" fill="#2d6a4f">5,5%</text>
    <text x="517" y="278" text-anchor="middle" fill="#b85c00">4,8%</text>
    <text x="555" y="282" text-anchor="middle" fill="#2d6a4f">4,6%</text>
    <text x="657" y="294" text-anchor="middle" fill="#b85c00">4,0%</text>
    <text x="695" y="304" text-anchor="middle" fill="#2d6a4f">3,5%</text>
  </g>

  <!-- legend -->
  <rect x="80" y="412" width="14" height="14" fill="#b85c00"/>
  <text x="100" y="423" class="legend" font-size="13">Quem trocou de emprego</text>
  <rect x="300" y="412" width="14" height="14" fill="#2d6a4f"/>
  <text x="320" y="423" class="legend" font-size="13">Quem ficou na mesma empresa</text>

  <text x="32" y="450" class="muted" font-size="11">Fontes: Federal Reserve Bank of Atlanta (Wage Growth Tracker); Bank of America — ver referências.</text>
</svg>
