<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .title { font-family: 'Playfair Display', Georgia, serif; fill: #1a1714; }
      .label { font-family: 'Source Serif 4', Georgia, serif; fill: #1a1714; }
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #5a534a; }
      .muted { font-family: 'Source Serif 4', Georgia, serif; fill: #8a8078; }
    </style>
  </defs>

  <rect x="0" y="0" width="800" height="460" fill="#faf9f6"/>
  <rect x="0.5" y="0.5" width="799" height="459" fill="none" stroke="#e2dbd0"/>

  <text x="32" y="44" class="title" font-size="22" font-weight="600">Quanto tempo até "entrar no ritmo"</text>
  <text x="32" y="66" class="muted" font-size="13">Prazo formal do contrato de experiência vs. tempo real até dominar projeto, equipe e rotina</text>

  <!-- axis -->
  <line x1="260" y1="100" x2="260" y2="400" stroke="#e2dbd0" stroke-width="1"/>
  <line x1="260" y1="400" x2="760" y2="400" stroke="#e2dbd0" stroke-width="1"/>
  <!-- gridlines every 30 days up to 210 -->
  <g class="mono" font-size="11">
    <line x1="260" y1="400" x2="760" y2="400" stroke="#e2dbd0"/>
    <line x1="331" y1="100" x2="331" y2="400" stroke="#e2dbd0" stroke-dasharray="2,4"/>
    <line x1="403" y1="100" x2="403" y2="400" stroke="#e2dbd0" stroke-dasharray="2,4"/>
    <line x1="474" y1="100" x2="474" y2="400" stroke="#e2dbd0" stroke-dasharray="2,4"/>
    <line x1="546" y1="100" x2="546" y2="400" stroke="#e2dbd0" stroke-dasharray="2,4"/>
    <line x1="617" y1="100" x2="617" y2="400" stroke="#e2dbd0" stroke-dasharray="2,4"/>
    <line x1="689" y1="100" x2="689" y2="400" stroke="#e2dbd0" stroke-dasharray="2,4"/>
    <text x="260" y="418" text-anchor="middle" fill="#8a8078">0</text>
    <text x="331" y="418" text-anchor="middle" fill="#8a8078">30d</text>
    <text x="403" y="418" text-anchor="middle" fill="#8a8078">60d</text>
    <text x="474" y="418" text-anchor="middle" fill="#8a8078">90d</text>
    <text x="546" y="418" text-anchor="middle" fill="#8a8078">120d</text>
    <text x="617" y="418" text-anchor="middle" fill="#8a8078">150d</text>
    <text x="689" y="418" text-anchor="middle" fill="#8a8078">180d</text>
  </g>

  <!-- bars: scale 1 day = 2.38px approx (500px / 210 days) -->
  <!-- CLT: 90 days -->
  <rect x="260" y="118" width="214" height="34" fill="#2d6a4f"/>
  <text x="252" y="140" text-anchor="end" class="label" font-size="14">Experiência CLT (45+45)</text>
  <text x="482" y="140" class="mono" font-size="12" fill="#2d6a4f">90 dias</text>

  <!-- PJ típico: ~90 days -->
  <rect x="260" y="166" width="214" height="34" fill="#3f8064"/>
  <text x="252" y="188" text-anchor="end" class="label" font-size="14">PJ / freelance típico</text>
  <text x="482" y="188" class="mono" font-size="12" fill="#3f8064">~90 dias</text>

  <!-- Internacional: 180 days -->
  <rect x="260" y="214" width="428" height="34" fill="#b85c00"/>
  <text x="252" y="236" text-anchor="end" class="label" font-size="14">Contrato internacional (meu caso)</text>
  <text x="696" y="236" class="mono" font-size="12" fill="#b85c00">180 dias</text>

  <!-- tempo real 3-6 meses: draw as range bar 90-180 -->
  <rect x="474" y="272" width="214" height="34" fill="#8a8078" opacity="0.85"/>
  <text x="252" y="294" text-anchor="end" class="label" font-size="14">Tempo real p/ dominar projeto, equipe e rotina</text>
  <text x="696" y="294" class="mono" font-size="12" fill="#5a534a">90–180 dias</text>

  <text x="32" y="440" class="muted" font-size="12">O período de "experiência" formal é só o começo — a curva de adaptação real costuma durar o dobro.</text>
</svg>
