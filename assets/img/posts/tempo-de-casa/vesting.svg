<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .title { font-family: 'Playfair Display', Georgia, serif; fill: #1a1714; }
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #5a534a; }
      .muted { font-family: 'Source Serif 4', Georgia, serif; fill: #8a8078; }
      .label { font-family: 'Source Serif 4', Georgia, serif; fill: #1a1714; }
    </style>
  </defs>

  <rect x="0" y="0" width="800" height="420" fill="#faf9f6"/>
  <rect x="0.5" y="0.5" width="799" height="419" fill="none" stroke="#e2dbd0"/>

  <text x="32" y="44" class="title" font-size="22" font-weight="600">O vesting de 4 anos não é acaso</text>
  <text x="32" y="66" class="muted" font-size="13">Modelo padrão de equity em tech: cliff de 1 ano, depois vesting linear até o ano 4</text>

  <!-- axes -->
  <line x1="90" y1="100" x2="90" y2="340" stroke="#e2dbd0"/>
  <line x1="90" y1="340" x2="740" y2="340" stroke="#e2dbd0"/>
  <g class="mono" font-size="12">
    <line x1="90" y1="270" x2="740" y2="270" stroke="#e2dbd0" stroke-dasharray="2,4"/>
    <line x1="90" y1="200" x2="740" y2="200" stroke="#e2dbd0" stroke-dasharray="2,4"/>
    <line x1="90" y1="130" x2="740" y2="130" stroke="#e2dbd0" stroke-dasharray="2,4"/>
    <text x="80" y="344" text-anchor="end" fill="#8a8078">0%</text>
    <text x="80" y="274" text-anchor="end" fill="#8a8078">25%</text>
    <text x="80" y="204" text-anchor="end" fill="#8a8078">50%</text>
    <text x="80" y="134" text-anchor="end" fill="#8a8078">75%</text>
    <text x="80" y="104" text-anchor="end" fill="#8a8078">100%</text>
  </g>
  <g class="mono" font-size="12">
    <text x="90" y="360" text-anchor="middle" fill="#8a8078">ano 0</text>
    <text x="252" y="360" text-anchor="middle" fill="#8a8078">ano 1</text>
    <text x="415" y="360" text-anchor="middle" fill="#8a8078">ano 2</text>
    <text x="577" y="360" text-anchor="middle" fill="#8a8078">ano 3</text>
    <text x="740" y="360" text-anchor="middle" fill="#8a8078">ano 4</text>
  </g>

  <!-- vesting curve: flat at 0 until year1 (cliff), jump to 25%, linear to 100% at year 4 -->
  <line x1="90" y1="340" x2="252" y2="340" stroke="#b85c00" stroke-width="3"/>
  <line x1="252" y1="340" x2="252" y2="270" stroke="#b85c00" stroke-width="3" stroke-dasharray="3,3"/>
  <line x1="252" y1="270" x2="740" y2="100" stroke="#2d6a4f" stroke-width="3"/>
  <circle cx="252" cy="340" r="5" fill="#b85c00"/>
  <circle cx="252" cy="270" r="5" fill="#b85c00"/>
  <circle cx="740" cy="100" r="5" fill="#2d6a4f"/>

  <text x="256" y="365" class="mono" font-size="11" fill="#b85c00">cliff — 0% até aqui</text>
  <text x="600" y="140" class="mono" font-size="11" fill="#2d6a4f">100% em 4 anos</text>

  <text x="32" y="396" class="muted" font-size="12">73% das empresas privadas de tech usam esse modelo — cliff de 1 ano, vesting mensal até 4 anos (Carta, 2024).</text>
</svg>
