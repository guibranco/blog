<svg viewBox="0 0 800 620" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .title { font-family: 'Playfair Display', Georgia, serif; fill: #1a1714; }
      .col-title { font-family: 'Playfair Display', Georgia, serif; fill: #faf9f6; }
      .item { font-family: 'Source Serif 4', Georgia, serif; fill: #1a1714; }
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #5a534a; }
      .muted { font-family: 'Source Serif 4', Georgia, serif; fill: #8a8078; }
    </style>
  </defs>

  <rect x="0" y="0" width="800" height="620" fill="#faf9f6"/>
  <rect x="0.5" y="0.5" width="799" height="619" fill="none" stroke="#e2dbd0"/>

  <text x="400" y="44" text-anchor="middle" class="title" font-size="24" font-weight="600">Ficar vs. Pular — o resumo</text>
  <text x="400" y="66" text-anchor="middle" class="muted" font-size="13">Nenhum dos dois é "certo" — o que importa é saber o que cada fase está te dando</text>

  <!-- column headers -->
  <rect x="40" y="90" width="340" height="44" fill="#2d6a4f"/>
  <text x="210" y="118" text-anchor="middle" class="col-title" font-size="18">Ficar tempo de mais</text>

  <rect x="420" y="90" width="340" height="44" fill="#b85c00"/>
  <text x="590" y="118" text-anchor="middle" class="col-title" font-size="18">Trocar com frequência</text>

  <!-- FICAR: a favor / contra -->
  <text x="56" y="158" class="item" font-size="14" font-weight="600" fill="#2d6a4f">A favor</text>
  <g class="item" font-size="13">
    <text x="56" y="180">✓ Conhece o "porquê", não só o "quê"</text>
    <text x="56" y="200">✓ Respostas na ponta da língua p/ decisões antigas</text>
    <text x="56" y="220">✓ Vê o ciclo de vida completo de um projeto</text>
    <text x="56" y="240">✓ Rede de confiança mais profunda internamente</text>
  </g>
  <text x="56" y="270" class="item" font-size="14" font-weight="600" fill="#b85c00">Risco</text>
  <g class="item" font-size="13">
    <text x="56" y="292">✗ Estagnação tecnológica sem perceber</text>
    <text x="56" y="312">✗ Referência salarial distante do mercado</text>
    <text x="56" y="332">✗ Rede de contatos concentrada numa empresa só</text>
  </g>

  <!-- PULAR: a favor / contra -->
  <text x="436" y="158" class="item" font-size="14" font-weight="600" fill="#2d6a4f">A favor</text>
  <g class="item" font-size="13">
    <text x="436" y="180">✓ Aumento salarial mais rápido no curto prazo</text>
    <text x="436" y="200">✓ Contato constante com stacks e práticas novas</text>
    <text x="436" y="220">✓ Rede de contatos mais ampla (menos profunda)</text>
    <text x="436" y="240">✓ Exposição a culturas e mercados diferentes</text>
  </g>
  <text x="436" y="270" class="item" font-size="14" font-weight="600" fill="#b85c00">Risco</text>
  <g class="item" font-size="13">
    <text x="436" y="292">✗ Recrutador lê instabilidade sem contexto</text>
    <text x="436" y="312">✗ Nunca vê um projeto do início ao fim</text>
    <text x="436" y="332">✗ Prêmio salarial de troca vem encolhendo</text>
  </g>

  <line x1="400" y1="90" x2="400" y2="352" stroke="#e2dbd0"/>
  <line x1="40" y1="360" x2="760" y2="360" stroke="#e2dbd0"/>

  <!-- bottom row: 3 key numbers -->
  <text x="400" y="392" text-anchor="middle" class="title" font-size="16" font-weight="600">Em números</text>

  <text x="150" y="440" text-anchor="middle" class="mono" font-size="28" fill="#2d6a4f">3–6</text>
  <text x="150" y="460" text-anchor="middle" class="muted" font-size="12">meses até entender</text>
  <text x="150" y="476" text-anchor="middle" class="muted" font-size="12">projeto, time e rotina</text>

  <text x="400" y="440" text-anchor="middle" class="mono" font-size="28" fill="#b85c00">5x</text>
  <text x="400" y="460" text-anchor="middle" class="muted" font-size="12">trocas em 10 anos já</text>
  <text x="400" y="476" text-anchor="middle" class="muted" font-size="12">acende alerta p/ recrutador</text>

  <text x="650" y="440" text-anchor="middle" class="mono" font-size="28" fill="#b85c00">85%</text>
  <text x="650" y="460" text-anchor="middle" class="muted" font-size="12">de quem aceita contraproposta</text>
  <text x="650" y="476" text-anchor="middle" class="muted" font-size="12">sai da empresa em ~6 meses</text>

  <line x1="40" y1="504" x2="760" y2="504" stroke="#e2dbd0"/>
  <text x="400" y="536" text-anchor="middle" class="item" font-size="14" font-style="italic">A pergunta não é "ficar ou pular" —</text>
  <text x="400" y="558" text-anchor="middle" class="item" font-size="14" font-style="italic">é "o que esta fase está me dando, e até quando vale a pena"</text>

  <text x="760" y="600" text-anchor="end" class="mono" font-size="11" fill="#8a8078">stracini.com.br/blog</text>
</svg>
