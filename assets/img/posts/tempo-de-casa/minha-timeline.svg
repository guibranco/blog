<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .title { font-family: 'Playfair Display', Georgia, serif; fill: #1a1714; }
      .label { font-family: 'Source Serif 4', Georgia, serif; fill: #1a1714; }
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #5a534a; }
      .muted { font-family: 'Source Serif 4', Georgia, serif; fill: #8a8078; }
    </style>
  </defs>

  <rect x="0" y="0" width="800" height="400" fill="#faf9f6"/>
  <rect x="0.5" y="0.5" width="799" height="399" fill="none" stroke="#e2dbd0"/>

  <text x="32" y="40" class="title" font-size="22" font-weight="600">Quase 15 anos, seis passagens</text>
  <text x="32" y="60" class="muted" font-size="13">Tempo de casa por empresa (em anos) — engajamentos part-time/OE não entram nesta comparação</text>

  <!-- scale: 1 year = 40px, start x = 260 -->
  <line x1="260" y1="86" x2="260" y2="360" stroke="#e2dbd0"/>
  <g class="mono" font-size="11">
    <line x1="300" y1="86" x2="300" y2="360" stroke="#e2dbd0" stroke-dasharray="2,4"/>
    <line x1="340" y1="86" x2="340" y2="360" stroke="#e2dbd0" stroke-dasharray="2,4"/>
    <line x1="380" y1="86" x2="380" y2="360" stroke="#e2dbd0" stroke-dasharray="2,4"/>
    <line x1="420" y1="86" x2="420" y2="360" stroke="#e2dbd0" stroke-dasharray="2,4"/>
    <line x1="460" y1="86" x2="460" y2="360" stroke="#e2dbd0" stroke-dasharray="2,4"/>
    <line x1="500" y1="86" x2="500" y2="360" stroke="#e2dbd0" stroke-dasharray="2,4"/>
    <line x1="540" y1="86" x2="540" y2="360" stroke="#e2dbd0" stroke-dasharray="2,4"/>
    <text x="260" y="376" text-anchor="middle" fill="#8a8078">0</text>
    <text x="340" y="376" text-anchor="middle" fill="#8a8078">2a</text>
    <text x="420" y="376" text-anchor="middle" fill="#8a8078">4a</text>
    <text x="500" y="376" text-anchor="middle" fill="#8a8078">6a</text>
    <text x="620" y="376" text-anchor="middle" fill="#8a8078">9a</text>
  </g>

  <!-- rows, bar height 28, gap -->
  <!-- Inovação: 7 years -->
  <rect x="260" y="92" width="280" height="28" fill="#2d6a4f"/>
  <text x="252" y="111" text-anchor="end" class="label" font-size="14">Inovação</text>
  <text x="548" y="111" class="mono" font-size="12" fill="#2d6a4f">7 anos · estagiário → coordenador</text>

  <!-- C&A: 7 months (~0.58y = 23px) -->
  <rect x="260" y="134" width="23" height="28" fill="#3f8064"/>
  <text x="252" y="153" text-anchor="end" class="label" font-size="14">C&amp;A</text>
  <text x="291" y="153" class="mono" font-size="12" fill="#3f8064">7 meses</text>

  <!-- Farfetch: 6 months (20px) -->
  <rect x="260" y="176" width="20" height="28" fill="#3f8064"/>
  <text x="252" y="195" text-anchor="end" class="label" font-size="14">Farfetch</text>
  <text x="288" y="195" class="mono" font-size="12" fill="#3f8064">6 meses</text>

  <!-- BS2: 2 years (80px) -->
  <rect x="260" y="218" width="80" height="28" fill="#b85c00"/>
  <text x="252" y="237" text-anchor="end" class="label" font-size="14">BS2</text>
  <text x="348" y="237" class="mono" font-size="12" fill="#b85c00">2 anos</text>

  <!-- Talabat: 2 years (80px) -->
  <rect x="260" y="260" width="80" height="28" fill="#b85c00"/>
  <text x="252" y="279" text-anchor="end" class="label" font-size="14">Talabat</text>
  <text x="348" y="279" class="mono" font-size="12" fill="#b85c00">2 anos</text>

  <!-- OUTsurance: ~4 years ongoing (160px), dashed edge -->
  <rect x="260" y="302" width="160" height="28" fill="#8a8078"/>
  <line x1="420" y1="302" x2="420" y2="330" stroke="#8a8078" stroke-width="3" stroke-dasharray="4,3"/>
  <text x="252" y="321" text-anchor="end" class="label" font-size="14">OUTsurance</text>
  <text x="428" y="321" class="mono" font-size="12" fill="#5a534a">quase 4 anos · em andamento</text>

  <text x="32" y="384" class="muted" font-size="12">Sete anos, seis meses, dois anos, dois anos, quase quatro — nenhum padrão fixo, cada fase com um motivo diferente.</text>
</svg>
