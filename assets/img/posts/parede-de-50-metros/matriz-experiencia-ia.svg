  <text x="329" y="210" font-family="'Source Serif 4', Georgia, serif" font-size="14" fill="#5a534a">O tijolo é da IA.</text>
  <text x="329" y="230" font-family="'Source Serif 4', Georgia, serif" font-size="14" fill="#5a534a">O porquê e o</text>
  <text x="329" y="250" font-family="'Source Serif 4', Georgia, serif" font-size="14" fill="#5a534a">prumo são seus.</text>

