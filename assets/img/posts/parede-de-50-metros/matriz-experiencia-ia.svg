  <text x="116" y="210" font-family="'Source Serif 4', Georgia, serif" font-size="14" fill="#5a534a">Fundação certa,</text>
  <text x="116" y="230" font-family="'Source Serif 4', Georgia, serif" font-size="14" fill="#5a534a">tijolo a tijolo.</text>
  <text x="116" y="250" font-family="'Source Serif 4', Georgia, serif" font-size="14" fill="#5a534a">Demora e fica.</text>

  <rect x="251" y="112" width="205" height="214" rx="6" fill="#e8f5ee" stroke="#2d6a4f" stroke-width="1.2"/>
  <text x="265" y="138" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="10.5" letter-spacing="1.4" fill="#2d6a4f">IA COMO ALAVANCA</text>
  <text x="265" y="164" font-family="'Playfair Display', Georgia, serif" font-size="17" font-weight="600" fill="#1a1714">Sólida e rápida</text>
