    <text x="353.5" y="100">COM IA</text>
    <text transform="translate(24 219) rotate(-90)">MUITA EXPERIÊNCIA</text>
    <text transform="translate(24 441) rotate(-90)">POUCA EXPERIÊNCIA</text>
  </g>

