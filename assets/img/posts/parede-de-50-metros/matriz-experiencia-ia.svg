  <text x="116" y="432" font-family="'Source Serif 4', Georgia, serif" font-size="14" fill="#5a534a">O erro vem aos</text>
  <text x="116" y="452" font-family="'Source Serif 4', Georgia, serif" font-size="14" fill="#5a534a">2 metros: custa</text>
  <text x="116" y="472" font-family="'Source Serif 4', Georgia, serif" font-size="14" fill="#5a534a">pouco e ensina.</text>

  <rect x="251" y="334" width="205" height="214" rx="6" fill="#f8ecdc" stroke="#b85c00" stroke-width="1.2"/>
  <text x="265" y="360" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="10.5" letter-spacing="1.4" fill="#b85c00">O RISCO NOVO</text>
  <text x="265" y="386" font-family="'Playfair Display', Georgia, serif" font-size="17" font-weight="600" fill="#1a1714">Alta, sem fundação</text>
