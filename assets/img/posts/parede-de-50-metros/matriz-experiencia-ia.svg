<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" width="480" height="640" role="img" aria-label="Matriz de experiência por uso de IA: com pouca experiência e sem IA, o muro é baixo e cai cedo; com pouca experiência e com IA, a parede fica alta e sem fundação; com muita experiência, a parede é sólida — lenta sem IA, rápida com IA">
  <rect width="480" height="640" fill="#faf9f6"/>
  <rect x="0.5" y="0.5" width="479" height="639" fill="none" stroke="#e2dbd0"/>

  <text x="240" y="38" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="21" font-weight="600" fill="#1a1714">A IA muda a altura da parede.</text>
  <text x="240" y="64" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="21" font-weight="600" font-style="italic" fill="#2d6a4f">A experiência, o que tem embaixo.</text>

