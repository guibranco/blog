  <text x="329" y="432" font-family="'Source Serif 4', Georgia, serif" font-size="14" fill="#5a534a">Primeira queda</text>
  <text x="329" y="452" font-family="'Source Serif 4', Georgia, serif" font-size="14" fill="#5a534a">aos 50 metros:</text>
  <text x="329" y="472" font-family="'Source Serif 4', Georgia, serif" font-size="14" fill="#5a534a">em produção.</text>

  <text x="240" y="578" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="13.5" font-style="italic" fill="#5a534a">Nos dois quadros da direita a ferramenta é a mesma.</text>
  <text x="240" y="597" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="13.5" font-style="italic" fill="#5a534a">O que muda é quem a segura.</text>

