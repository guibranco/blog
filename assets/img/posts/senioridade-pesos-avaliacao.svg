<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" role="img" aria-label="Gráfico do peso de cada critério na avaliação de uma entrevista técnica, com análise e tomada de decisão somando 60 por cento e ferramentas conhecidas apenas 5 por cento">
  <style>
    .pt{font-family:'Playfair Display',Georgia,serif;font-size:19px;fill:#1a1714}
    .pl{font-family:'Source Serif 4',Georgia,serif;font-size:15px;fill:#1a1714}
    .pd{font-family:'JetBrains Mono',Consolas,monospace;font-size:11px;fill:#8a8078}
    .pv{font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;fill:#5a534a}
  </style>
  <rect width="680" height="380" fill="#f2ede6"/>

  <text class="pt" x="20" y="34">Peso de cada critério na minha avaliação</text>
  <text class="pd" x="20" y="54">distribuição ilustrativa, baseada na forma como eu conduzo o cenário</text>

  <text class="pl" x="20" y="94">Análise e questionamento</text>
  <rect x="290" y="80" width="315" height="20" rx="3" fill="#2d6a4f"/>
  <text class="pv" x="615" y="95">35%</text>
  <text class="pd" x="20" y="112">percebeu o que não foi dito</text>

  <text class="pl" x="20" y="150">Tomada de decisão</text>
  <rect x="290" y="136" width="225" height="20" rx="3" fill="#2d6a4f" opacity="0.85"/>
  <text class="pv" x="525" y="151">25%</text>
  <text class="pd" x="20" y="168">escolheu, justificou e assumiu o trade-off</text>

  <text class="pl" x="20" y="206">Profundidade técnica</text>
  <rect x="290" y="192" width="180" height="20" rx="3" fill="#b85c00"/>
  <text class="pv" x="480" y="207">20%</text>
  <text class="pd" x="20" y="224">entende o que acontece por baixo</text>

  <text class="pl" x="20" y="262">Código escrito</text>
  <rect x="290" y="248" width="135" height="20" rx="3" fill="#b85c00" opacity="0.7"/>
  <text class="pv" x="435" y="263">15%</text>
  <text class="pd" x="20" y="280">legibilidade, estrutura, testabilidade</text>

  <text class="pl" x="20" y="318">Ferramentas que conhece</text>
  <rect x="290" y="304" width="45" height="20" rx="3" fill="#8a8078"/>
  <text class="pv" x="345" y="319">5%</text>
  <text class="pd" x="20" y="336">a stack do currículo</text>

  <line x1="290" y1="352" x2="660" y2="352" stroke="#e2dbd0"/>
  <text class="pd" x="290" y="370">O currículo responde os 5% de baixo. A entrevista existe para os 60% de cima.</text>
</svg>
