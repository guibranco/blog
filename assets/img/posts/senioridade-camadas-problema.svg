<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="680" height="470" role="img" aria-label="Infográfico das seis camadas da mesma demanda e até qual delas cada nível de senioridade desce sozinho">
  <style>
    .lb{font-family:'Source Serif 4',Georgia,serif;font-size:16px;fill:#1a1714}
    .sm{font-family:'JetBrains Mono',Consolas,monospace;font-size:11px;fill:#8a8078}
    .ch{font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;fill:#5a534a;letter-spacing:1px}
    .tt{font-family:'JetBrains Mono',Consolas,monospace;font-size:12px;fill:#8a8078;letter-spacing:2px}
  </style>
  <rect width="680" height="470" fill="#f2ede6"/>

  <text class="tt" x="20" y="30">CAMADAS DA MESMA DEMANDA</text>
  <text class="ch" x="500" y="58">JR</text>
  <text class="ch" x="560" y="58">PL</text>
  <text class="ch" x="620" y="58">SR</text>

  <rect x="20" y="70" width="450" height="56" rx="4" fill="#faf9f6" stroke="#e2dbd0"/>
  <text class="lb" x="38" y="94">1. Interface</text>
  <text class="sm" x="38" y="113">a div de 10x10 e o CSS</text>
  <circle cx="505" cy="98" r="9" fill="#2d6a4f"/>
  <circle cx="565" cy="98" r="9" fill="#2d6a4f"/>
  <circle cx="625" cy="98" r="9" fill="#2d6a4f"/>

  <rect x="20" y="134" width="450" height="56" rx="4" fill="#faf9f6" stroke="#e2dbd0"/>
  <text class="lb" x="38" y="158">2. Cálculo</text>
  <text class="sm" x="38" y="177">mapear data para cor</text>
  <circle cx="505" cy="162" r="9" fill="#2d6a4f"/>
  <circle cx="565" cy="162" r="9" fill="#2d6a4f"/>
  <circle cx="625" cy="162" r="9" fill="#2d6a4f"/>

  <rect x="20" y="198" width="450" height="56" rx="4" fill="#faf9f6" stroke="#e2dbd0"/>
  <text class="lb" x="38" y="222">3. Fonte da verdade</text>
  <text class="sm" x="38" y="241">servidor ou cliente — todos veem igual?</text>
  <circle cx="505" cy="226" r="9" fill="none" stroke="#8a8078" stroke-width="1.5"/>
  <circle cx="565" cy="226" r="9" fill="#2d6a4f"/>
  <circle cx="625" cy="226" r="9" fill="#2d6a4f"/>

  <rect x="20" y="262" width="450" height="56" rx="4" fill="#faf9f6" stroke="#e2dbd0"/>
  <text class="lb" x="38" y="286">4. Persistência</text>
  <text class="sm" x="38" y="305">a cor de 15/03 repete no ano que vem?</text>
  <circle cx="505" cy="290" r="9" fill="none" stroke="#8a8078" stroke-width="1.5"/>
  <circle cx="565" cy="290" r="9" fill="#2d6a4f"/>
  <circle cx="625" cy="290" r="9" fill="#2d6a4f"/>

  <rect x="20" y="326" width="450" height="56" rx="4" fill="#e8f5ee" stroke="#2d6a4f"/>
  <text class="lb" x="38" y="350">5. Tempo</text>
  <text class="sm" x="38" y="369">bissexto, fuso horário, horário de verão</text>
  <circle cx="505" cy="354" r="9" fill="none" stroke="#8a8078" stroke-width="1.5"/>
  <circle cx="565" cy="354" r="9" fill="none" stroke="#8a8078" stroke-width="1.5"/>
  <circle cx="625" cy="354" r="9" fill="#2d6a4f"/>

  <rect x="20" y="390" width="450" height="56" rx="4" fill="#e8f5ee" stroke="#2d6a4f"/>
  <text class="lb" x="38" y="414">6. Entrega e operação</text>
  <text class="sm" x="38" y="433">cache, CDN, suporte, o que a UI comunica</text>
  <circle cx="505" cy="418" r="9" fill="none" stroke="#8a8078" stroke-width="1.5"/>
  <circle cx="565" cy="418" r="9" fill="none" stroke="#8a8078" stroke-width="1.5"/>
  <circle cx="625" cy="418" r="9" fill="#2d6a4f"/>
</svg>
